 */const mg=$("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]),yg={name:"Γιάννης Τζαβάρας",role:"Φιλόσοφος · Ομότιμος Καθηγητής Φιλοσοφίας",place:"Πανεπιστήμιο Κρήτης, Ρέθυμνο"},vg={home:"Αρχική",biography:"Βιογραφία",cv:"Βιογραφικό (CV)",chronology:"Χρονολόγιο",works:"Έργο",interests:"Ενδιαφέροντα",books:"Βιβλία",articles:"Άρθρα",blog:"Ιστολόγιο",activities:"Δραστηριότητες",contact:"Επικοινωνία"},kg={language:"Γλώσσα",greek:"Ελληνικά",english:"Αγγλικά",german:"Γερμανικά",introduction:"Εισαγωγή",notFound:"Η σελίδα που αναζητάτε δεν βρέθηκε.",readMore:"Διαβάστε περισσότερα",back:"Επιστροφή",backToBlog:"Πίσω στο ιστολόγιο",explore:"Εξερευνήστε το έργο",readBlog:"Διαβάστε το ιστολόγιο",minRead:"λεπτά ανάγνωσης",minReadOne:"λεπτό ανάγνωσης",publishedOn:"Δημοσιεύθηκε",tags:"Θεματικές",viewAll:"Δείτε όλα",scroll:"Κυλήστε",menu:"Μενού"},xg={heroKicker:"Ελληνική φιλοσοφική σκέψη",heroTitle:"Γιάννης Τζαβάρας",heroSubtitle:"Φιλόσοφος, μεταφραστής και δάσκαλος. Ομότιμος Καθηγητής Φιλοσοφίας του Πανεπιστημίου Κρήτης, με έργο επικεντρωμένο στην οντολογία, τη μεταφυσική και τη συνομιλία της ελληνικής σκέψης με τη γερμανική φιλοσοφία.",heroQuote:"Η φιλοσοφία δεν δίνει απαντήσεις· μας μαθαίνει να ρωτάμε σωστά.",heroQuoteAuthor:"Γ. Τζαβάρας",ctaExplore:"Εξερευνήστε το έργο",ctaBlog:"Πρόσφατες σκέψεις",introTitle:"Μια ζωή μέσα στις ιδέες",introParagraphs:["Επί δεκαετίες, ο Γιάννης Τζαβάρας στάθηκε ανάμεσα σε δύο κόσμους σκέψης: στην αρχαία ελληνική φιλοσοφία, που έθεσε για πρώτη φορά το ερώτημα του Είναι, και στη νεότερη γερμανική φιλοσοφία, που το ανανέωσε με νέους όρους.","Το έργο του —μεταφραστικό, ερμηνευτικό και πρωτότυπο— χτίζει γέφυρες ανάμεσα στον Πλάτωνα και τον Χάιντεγκερ, ανάμεσα στον Αριστοτέλη και τον Χέγκελ, με μια γλώσσα καθαρή, αυστηρή και βαθιά ανθρώπινη.","Αυτός ο ιστότοπος συγκεντρώνει τα βιβλία, τα άρθρα, τη βιογραφία και τις πιο πρόσφατες σκέψεις του — ένα ζωντανό αρχείο για όσους θέλουν να σκεφτούν μαζί του."],highlightsTitle:"Άξονες του έργου",highlights:[{icon:"scroll",title:"Οντολογία & Μεταφυσική",text:"Η ερώτηση για το νόημα του Είναι, από τους προσωκρατικούς ώς τον Χάιντεγκερ."},{icon:"languages",title:"Φιλοσοφική μετάφραση",text:"Η μεταφορά κορυφαίων κειμένων της γερμανικής φιλοσοφίας σε δόκιμη ελληνική γλώσσα."},{icon:"graduation-cap",title:"Διδασκαλία",text:"Γενιές φοιτητών στο Πανεπιστήμιο Κρήτης που έμαθαν να διαβάζουν τα κείμενα εκ του σύνεγγυς."},{icon:"feather",title:"Δοκίμιο & Στοχασμός",text:"Πρωτότυπα κείμενα για τη γλώσσα, την τέχνη, τον θάνατο και το ανθρώπινο μέτρο."}],featuredQuote:"Σκέφτομαι σημαίνει: μένω πιστός σε ένα ερώτημα, ακόμη κι όταν δεν υπόσχεται καμία ανάπαυση.",featuredQuoteSource:"Από σημειώσεις διαλέξεων, Ρέθυμνο"},wg={title:"Βιογραφία",lead:"Μια διαδρομή από τη μελέτη των κλασικών κειμένων ώς την έδρα της φιλοσοφίας — και πέρα από αυτήν.",youngCaption:"Τα πρώτα χρόνια",paragraphs:["Ο Γιάννης Τζαβάρας ανήκει στη γενιά των Ελλήνων φιλοσόφων που, στο δεύτερο μισό του 20ού αιώνα, ανέλαβαν να φέρουν τη σύγχρονη ευρωπαϊκή φιλοσοφία σε γόνιμη συνομιλία με την ελληνική παράδοση. Σπούδασε φιλοσοφία στην Ελλάδα και στη Γερμανία, όπου ήρθε σε άμεση επαφή με τη μεταφυσική και την ερμηνευτική παράδοση.","Η συνάντησή του με το έργο του Μάρτιν Χάιντεγκερ υπήρξε καθοριστική. Αφιέρωσε χρόνια στη μελέτη και τη μετάφραση θεμελιωδών κειμένων, με στόχο όχι την απλή μεταφορά λέξεων, αλλά τη δημιουργία μιας ελληνικής φιλοσοφικής γλώσσας ικανής να φιλοξενήσει τις πιο απαιτητικές έννοιες.","Ως καθηγητής στο Τμήμα Φιλοσοφικών και Κοινωνικών Σπουδών του Πανεπιστημίου Κρήτης, στο Ρέθυμνο, δίδαξε οντολογία, ιστορία της φιλοσοφίας και μεταφυσική. Η διδασκαλία του χαρακτηριζόταν από την επιμονή στην προσεκτική, αργή ανάγνωση των κειμένων — μια άσκηση υπομονής και ακρίβειας.","Σήμερα, ως Ομότιμος Καθηγητής, συνεχίζει να γράφει, να μεταφράζει και να στοχάζεται, μοιραζόμενος τις σκέψεις του μέσα από δοκίμια και αναρτήσεις στο ιστολόγιό του."],timelineTitle:"Σταθμοί",timeline:[{year:"Πρώτα χρόνια",title:"Σπουδές φιλοσοφίας",text:"Θεμελιώδεις σπουδές στην κλασική και τη νεότερη φιλοσοφία, στην Ελλάδα και στη Γερμανία."},{year:"Έρευνα",title:"Συνάντηση με τη μεταφυσική",text:"Εμβάθυνση στον Χούσερλ και τον Χάιντεγκερ· αρχή ενός μακρόχρονου μεταφραστικού εγχειρήματος."},{year:"Διδασκαλία",title:"Πανεπιστήμιο Κρήτης, Ρέθυμνο",text:"Πολυετής θητεία ως καθηγητής φιλοσοφίας· σεμινάρια οντολογίας και ερμηνευτικής."},{year:"Συγγραφή",title:"Βιβλία & μεταφράσεις",text:"Σειρά πρωτότυπων μελετών και μεταφράσεων-ορόσημων της γερμανικής φιλοσοφίας."},{year:"Σήμερα",title:"Ομότιμος Καθηγητής",text:"Συνεχιζόμενη συγγραφή, δοκίμιο και δημόσιος στοχασμός μέσα από το ιστολόγιο."}],influencesTitle:"Συνομιλητές & επιρροές",influences:["Πλάτων","Αριστοτέλης","Ηράκλειτος","Immanuel Kant","G. W. F. Hegel","Søren Kierkegaard","Edmund Husserl","Martin Heidegger"]},Sg={title:"Βιογραφικό Σημείωμα (CV)",lead:"Σπουδές, ακαδημαϊκή σταδιοδρομία και δημοσιεύσεις του Γιάννη Τζαβάρα, σε συνοπτική μορφή βιογραφικού σημειώματος.",backLink:"Επιστροφή στη Βιογραφία",photo:{src:"images/yiannis-2009.jpg",caption:"Γιάννης Τζαβάρας, 2009"},detailsHeading:"Στοιχεία",details:[{label:"Επώνυμο",value:"Τζαβάρας"},{label:"Όνομα",value:"Ιωάννης"},{label:"Θέση",value:"Ομότιμος Καθηγητής"},{label:"Ειδίκευση",value:"Φιλοσοφία με έμφαση στη Μεταφυσική"},{label:"Διεύθυνση",value:"Ρουσσοσπίτι Τ.Θ. 4642, 74100 Ρέθυμνο"},{label:"Τηλέφωνο",value:"+30 6945953220"},{label:"E-mail",value:"itzavaras@yahoo.gr"}],sections:[{heading:"Σπουδές",entries:[{label:"Προπτυχιακές",text:"Πανεπιστήμιο Αθηνών, Φιλοσοφική Σχολή, Τμήμα Φιλοσοφίας: 1968–1973."},{label:"Μεταπτυχιακές",text:"Ειδίκευση στη Φιλοσοφία: α) Γκαίτινγκεν (Γερμανία), χειμερινό εξάμηνο 1973–74· β) Μόναχο (Γερμανία), εαρινό εξάμηνο 1974 – εαρινό εξάμηνο 1978."},{label:"Διδακτορικό",text:"Πανεπιστήμιο Μονάχου, 1974–1978. Διδακτορική διατριβή: «Η κίνηση κατά τον Κίρκεγκωρ»."}]},{heading:"Πανεπιστημιακή διδασκαλία (Πανεπιστήμιο Κρήτης)",entries:[{label:"Σύ  και εκδόσεων."},{label:"Μεταφράσεις & σχόλια",text:"Μεταφράσεις και σχολιασμοί φιλοσοφικών έργων των: Sören Kierkegaard, Martin Heidegger, Immanuel Kant, Paul Feyerabend, Georg Hegel, Πλωτίνου, Θωμά Ακινάτη, Joanna Haynes, Rainer Maria Rilke, Friedrich Hölderlin."}]},sourceLabel:"Διαβάστε περισσότερα στην προσωπική ιστοσελίδα",sourceUrl:"https://istoselidatzavara.webnode.page/tzavaras-john-curriculum-cv-/"},Pg={title:"Χρονολόγιο",lead:"Από τη γέννηση το 1950 έως σήμερα: σπουδές, ακαδημαϊκοί σταθμοί και το συγγραφικό και μεταφραστικό έργο, έτος προς έτος.",note:"Πλήρες χρονολόγιο ζωής, σπουδών, διορισμών και δημοσιευμάτων.",milestoneLabel:"Σταθμός"},Eg={title:"Το έργο",lead:"Τέσσερις αλληλένδετοι άξονες συνθέτουν μια ενιαία φιλοσοφική πορεία.",areas:[{title:"Οντολογία",text:"Στο κέντρο του έργου βρίσκεται το αρχαιότερο ερώτημα της φιλοσοφίας: τι σημαίνει «είναι»; Μέσα από τους προσωκρατικούς, τον Πλάτωνα και τον Αριστοτέλη, και ώς τη σύγχρονη επαναδιατύπωση του ερωτήματος, αναζητείται το νόημα της ίδιας της ύπαρξης."},{title:"Μεταφυσική & Ερμηνευτική",text:"Η μέθοδος του «επιστρέφειν στα ίδια τα πράγματα» και η τέχνη της ερμηνείας οδηγούν σε μια φιλοσοφία που δεν επιβάλλει σχήματα, αλλά αφήνει τα φαινόμενα να φανερωθούν."},{title:"Φιλοσοφία της γλώσσας",text:"Η γλώσσα δεν είναι απλό εργαλείο, αλλά ο τόπος όπου το νόημα γίνεται δυνατό. Η μετάφραση γίνεται έτσι η ίδια φιλοσοφική πράξη — αναζήτηση της σωστής λέξης ως αναζήτηση της αλήθειας."},{title:"Ηθική & Ανθρώπινο μέτρο",text:"Πέρα από τη θεωρία, το ερώτημα παραμένει: πώς οφείλει να ζει κανείς; Ο θάνατος, ο χρόνος, η ελευθερία και η ευθύνη ορίζουν τον ορίζοντα μιας στοχαστικής ζωής."}]},zg={title:"Ενδιαφέροντα",lead:"Τα πεδία που σημάδεψαν τη σκέψη και το έργο του Γιάννη Τζαβάρα — από την αρχαία ελληνική φιλοσοφία ώς την αισθητική αγωγή — μαζί με τα σχετικά βιβλία, μεταφράσεις και επιστημονικές ανακοινώσεις.",photos:[{src:"images/foto-giannis.jpg",caption:"Γιάννης Τζαβάρας"},{src:"images/giannis-rubik.jpg",caption: 8."},{year:"2008",title:"«Ο συγκαιρινός και ο κατοπινός μαθητής κατά τον Κίρκεγκωρ»",source:"*Φιλοσοφία και Παιδεία* 49-50 (2008), 4-6."},{year:"2010",title:"«Μεταφράζοντας το Dasein του Martin Heidegger»",source:"Στο: *Ευβουλία. Αφιέρωμα στον ομότιμο καθηγητή Βασίλειο Α. Κύρκο* (επιμ. Κωνσταντίνος Θ. Πέτσιος), Ιωάννινα 2010, 255-262."},{year:"2012",title:"«Η στοχαστική διαλογική δραστηριότητα ως έξοχη ευκαιρία για εκδημοκρατισμό του σχολικού αναλυτικού προγράμματος»",source:"Πρακτικά ημερίδας (Ρέθυμνο, 22-10-2010), 1-8. Αναδημοσιεύτηκε στο *Διά-ΛΟΓΟΣ* 2 (2012), 294-304."},{year:"2012",title:"«Η ανθρώπινη μοίρα κατά τον Heidegger»",source:"*Φιλοσοφείν* 5 (2012), 188-210."},{year:"2013",title:"«Η τελεολογική αναστολή της ηθικότητας κατά τον Kierkegaard. Μια υπεράσπιση»",source:"*Φιλοσοφία. Επετηρίς του Κέντρου Ερεύνης της Ελληνικής Φιλοσοφίας της Ακαδημίας Αθηνών* 43 (2013), 365-380."},{year:"2013",title:"«Η δημοκρατική εκπαίδευση ως εμπειρία συλλογικής αυτοθέσμισης και αυτοδιαχείρισης»",source:"Ανακοίνωση στην επιστημονική διημερίδα «Η κρίση της δημοκρατίας ως κρίση της δημοκρατικής παιδείας» (Αλεξανδρούπολη, 8-9/11/2013)."},{year:"2014",title:"«Κράτος και εκπαίδευση κατά τον πρώιμο Νίτσε»",source:"*Φιλοσοφία και Παιδεία* 66-67 (2014), 4-7."},{year:"2015",title:"«Ο σφαιρικός θεός του Εμπεδοκλή»",source:"*Φιλοσοφικά Δημοσιεύματα 2015*, 1-18."},{year:"2016",title:"«Νεότερες περιπέτειες του νόμου της αιτιότητας»",source:"*Φιλοσοφείν: επιστήμη, εύνοια, παρρησία* 14 (2016), 399-409."},{year:"2017",title:"«Εμπειρία θανάτου κατά τον Ρίλκε»",source:"*Φιλοσοφείν: επιστήμη, εύνοια, παρρησία* 15 (2017), 355-374."},{year:"2018",title:"«Ο χρόνος κατά τον Αίαντα του Σοφοκλή»",source:"*Φιλοσοφείν: επιστήμη, εύνοια, παρρησία* 18 (Ιούνιος 2018), 227-238."},{year:"2019",title:"«Η ουσία της σύγχρονης τέχνης κατά τον Heidegger»",source:"*Ελληνική Φιλοσοφική Επιθεώρηση* 108 (2019), 210-225."},{year:"2021",title:"«Μικρή Λογική» (Χέγκελ)",source:"*Βικιπαίδεια*, Μάιος 2021."}]},Tg={title:"Ιστολόγιο",lead:"Σκέψεις, σημειώσεις και σύντομα δοκίμια — γραμμένα στον ρυθμό της καθημερινής μελέτης.",posts:[{id:"i-techni-tis-argis-anagnosis",date:"2026-05-18",title:"Η τέχνη της αργής ανάγνωσης",tags:["παιδεία","ανάγνωση","μέθοδος"],excerpt:"Σε έναν κόσμο που διαβάζει όλο και πιο γρήγορα, η φιλοσοφία επιμένει σε κάτι αντίθετο: στην υπομονή.",body:["Όταν διδάσκω, λέω συχνά στους φοιτητές μου ότι ένα φιλοσοφικό κείμενο δεν διαβάζεται· κατοικείται. Δεν περνάμε από μέσα του βιαστικά, όπως από έναν διάδρομο. Μένουμε, ξανακοιτάζουμε, αφήνουμε τις λέξεις να ανοίξουν.","Η αργή ανάγνωση δεν είναι αυτοσκοπός. Είναι μέθοδος. Για να μελετηθεί μια σελίδα του Αριστοτέλη ή του Χάιντεγκερ μπορεί να απαιτηθεί μια ολόκληρη μέρα — και αυτό δεν είναι αποτυχία, είναι ο σωστός ρυθμός.","Ίσως το πιο επαναστατικό πράγμα που μπορεί να κάνει σήμερα ένας νέος άνθρωπος να είναι αυτό: να καθίσει με ένα δύσκολο βιβλίο και να μην βιαστεί."]},{id:"giati-metafrazoume",date:"2026-03-02",title:"Γιατί μεταφράζουμε φιλοσοφία",tags:["μετάφραση","γλώσσα"],excerpt:"Κάθε μετάφραση είναι μια ερμηνεία, και κάθε ερμηνεία μια απόφαση για το τι σημαίνει αλήθεια.",body:["Με ρωτούν συχνά γιατί αφιέρωσα τόσα χρόνια στη μετάφραση κειμένων που λίγοι θα διαβάσουν. Η απάντησή μου είναι απλή: η μετάφραση είναι ο πιο αργός και ο πιο πιστός τρόπος ανάγνωσης.","Για να μεταφράσεις μια λέξη του Χάιντεγκερ, πρέπει να την καταλάβεις ώς το τέλος. Δεν αρκεί να ξέρεις τι σημαίνει· πρέπει να βρεις πώς ακούγεται η ίδια σκέψη στη δική σου γλώσσα.","Έτσι, η ελληνική γλώσσα δεν δέχεται απλώς μια ξένη ιδέα — αλλάζει και η ίδια, μεγαλώνει, βρίσκει καινούριες δυνατότητες. Αυτό είναι το πραγματικό κέρδος της μετάφρασης."]},{id:"to-erotima-pou-menei",date:"2026-01-11",title:"Το ερώτημα που μένει",tags:["οντολογία","στοχασμός"],excerpt:"Η φιλοσοφία δεν συσσωρεύει απαντήσεις· καλλιεργεί ένα ερώτημα που δεν παύει.",body:["Μετά από μια ζωή μέσα στα βιβλία, ομολογώ πως δεν έχω περισσότερες βεβαιότητες απ' όσες είχα στα νιάτα μου. Έχω όμως καλύτερα ερωτήματα.","Το ερώτημα του Είναι — γιατί υπάρχει κάτι και όχι μάλλον το τίποτα — δεν λύθηκε ποτέ, και ίσως δεν πρέπει να λυθεί. Η αξία του δεν βρίσκεται στην απάντηση αλλά στο ότι μας κρατάει ξύπνιους.","Αυτό προσπαθώ να αφήσω στους μαθητές μου: όχι ένα σύστημα, αλλά μια ικανότητα να εκπλήσσονται μπροστά στο γεγονός ότι ο κόσμος υπάρχει."]}]},Ng={title:"Ευρύτερες δραστηριότητες",lead:"Ιστοσελίδες, ακαδημαϊκές και θεσμικές δραστηριότητες, καθώς και διαλέξεις του Γιάννη Τζαβάρα.",sourceLabel:"Διαβάστε περισσότερα στην προσωπική ιστοσελίδα",sourceUrl:"https://istoselidatzavara.webnode.page/%ce%b5%cf%85%cf%81%cf%8d%cf%84%ce%b5%cf%81%ce%b5%cf%82%20%ce%b4%cf%81%ce%b1%cf%83%cf%84%ce%b7%cf%81%ce%b9%cf%8c%cf%84%ce%b7%cf%84%ce%b5%cf%82/",sections:[{id:"websites",letter:"Α",heading:"Ιστοσελίδες του Γιάννη Τζαβάρα",items:[{text:"Ελληνική Φιλοσοφική Βιβλιογραφία 1980-2019. Αρχείο ελληνόγλωσσης φιλοσοφικής βιβλιογραφίας.",url:"https://tzavaras-ioannis.blogspot.com/2022/05/blog-post_9.html"},{text:"Αισθητική Αγωγή. Εξαμηνιαίο φοιτητικό περιοδικό (ανελλιπώς από τον Οκτώβριο του 2002 έως τον Οκτώβριο του 2014) με την εκδοτική επιμέλεια του Γιάννη Τζαβάρα και με γραφιστική επιμέλεια του γραφίστα Κωνσταντίνου Νύκταρη. Περιελάμβανε κυρίως σεμιναριακές εργασίες από το σεμινάριο Αισθητικής Αγωγής που επόπτευε ο Γ. Τζαβάρας. Δημοσίευσε πρωτότυπα κείμενα που αναφέρονταν σε μια εκτεταμένη περιοχή: Α) Σε θεωρίες γύρω από την τέχνη, το ωραίο και τις σχετικές έννοιες. Β) Σε καλλιτεχνικά έργα (ανάλυση και αξιολόγησή τους). Γ) Στην ιστορία της τέχνης. Δ) Στην αισθητική καλλιέργεια και στην καλλιτεχνική εκπαίδευση. Ειδικότερα το ενδιαφέρον εστιάσθηκε στο χώρο της προσχολικής και πρωτοσχολικής εκπαίδευσης.",url:"http://periodikoaisthag.webnode.com"},{text:"Θέατρο σκιών και εκπαίδευση. Μια προσπάθεια να γίνουν γνωστές στο ελληνικό κοινό οι εκπαιδευτικές δυνατότητες του Θεάτρου Σκιών πέρα από τον παραδοσιακό Καραγκιόζη.",url:"http://theatroskivvn.yolasite.com"},{text:"Φιλοσοφία για παιδιά. Μια προσπάθεια να γίνει γνωστό στο ελληνικό κοινό το διεθνές φιλοσοφικό-παιδαγωγικό κίνημα «φιλοσοφία για παιδιά».",url:"https://childrenandphilosophy.webnode.com"},{text:"«Φιλοσοφικά Δημοσιεύματα». Ηλεκτρονική δημοσίευση ελληνόγλωσσων φιλοσοφικών κειμένων από το 2011 κ. εξής.",url:"https://www.philosophicalbibliography.com/index.php?option=com_content&view=article&id=5%3Afilosofika-dimosieymata"}]},{id:"other",letter:"Β",heading:"Άλλες δραστηριότητες",items:[{text:"Διετέλεσε αναπληρωτής εκπρόσωπος του Πανεπιστημίου Κρήτης στη Νομαρχιακή Επιτροπή Λαϊκής Επιμόρφωσης (= Ν.Ε.Λ.Ε.) του Νομού Ρεθύμνης επί μία διετία (1985-1987)."},{text:"Συνετέλεσε στη διοργάνωση των εξής συνεδρίων: Α) «Φιλοσοφικό Συμπόσιο Wittgenstein», 15-17/12/1989. Β) «Παρόν και μέλλον της φιλοσοφίας». Διήμερο φιλοσοφικό Συμπόσιο, Ορθόδοξη Ακαδημία Κρήτης, Νοέμβριος του 1991. Γ) «Τεχνολογία και γνώση. Φιλοσοφικές και κοινωνιολογικές διερευνήσεις». Διήμερο διεθνές σεμινάριο, Ρέθυμνο, 17-18/10/1996."},{text:"Κατά το ακαδημαϊκό έτος 1993-1994 διετέλεσε Πρόεδρος του Τμήματος Φιλοσοφικών και Κοινωνικών Σπουδών, κατά τα ακαδημαϊκά έτη 2005-2007 Πρόεδρος του Παιδαγωγικού Τμήματος Προσχολικής Εκπαίδευσης του Πανεπιστημίου Κρήτης."},{text:"Επέβλεψε επί σειρά ετών ως κύριος επόπτης τη διδακτορική διατριβή του Κώστα Κουρπέτη με θέμα: «Άνθρωπος και Θεός στον Εμπεδοκλή». Η διατριβή υποστηρίχθηκε με επιτυχία (βαθμός: άριστα) τον Ιούνιο του 1996."},{text:"Υπήρξε μέλος πολλών τριμελών επιτροπών που συγκροτήθηκαν για την επίβλεψη μεταπτυχιακών εργασιών ειδίκευσης (Master) και διδακτορικών διατριβών (PhD). Επιπλέον έκρινε μια πληθώρα διδακτορικών εργασιών ως μέλος της επταμελούς εξεταστικής τους επιτροπής."},{text:"Υπήρξε μέλος πολλών εκλεκτορικών σωμάτων που συγκροτήθηκαν για να κρίνουν την εκλογή ή εξέλιξη μελών Δ.Ε.Π. του Πανεπιστημίου Κρήτης και άλλων ελληνικών Πανεπιστημίων."},{text:"Κατά τα έτη 1993-1997 διετέλεσε τακτικό μέλος της Επιτροπής Ερευνών (Ε.Λ.Κ.Ε.) του Πανεπιστημίου Κρήτης ως εκπρόσωπος του Τμήματος Φιλοσοφικών και Κοινωνικών Σπουδών."},{text:"Διετέλεσε επί σειρά ετών Αναπληρωτής Πρόεδρος του Τμήματος Φιλοσοφικών και Κοινωνικών Σπουδών και του Παιδαγωγικού Τμήματος Προσχολικής Εκπαίδευσης του Πανεπιστημίου Κρήτης."},{text:"Διετέλεσε επί σειρά ετών (1998-2005) Αντιπρόεδρος του Διδασκαλείου Νηπιαγωγών του Πανεπιστημίου Κρήτης και κατά τα έτη 2005-2007 Πρόεδρος του ίδιου Διδασκαλείου."},{text:"Διοργάνωσε επιστημονική ημερίδα με θέμα: «Από τον μονόλογο του δασκάλου στον ομαδικό διάλογο. Φιλοσοφική σκέψη και διερεύνηση στην πρωτοβάθμια σχολική τάξη» (Ρέθυμνο, 22-10-2010). Τα Πρακτικά της ημερίδας, με εμπλουτισμένες και βελτιωμένες τις ανακοινώσεις των συνέδρων, δημοσιεύτηκαν στο περιοδικό Διά-ΛΟΓΟΣ 2 (2012), σελ. 181-339."},{text:"Διετέλεσε μέλος της ΜΟ.ΔΙ.Π. (= Μονάδα Διασφάλισης της Ποιότητας) του Πανεπιστημίου Κρήτης από το 2010 έως το 2012."},{text:"Διετέλεσε συνεκδότης του περιοδικού: Διά-ΛΟΓΟΣ. Επετηρίδα Φιλοσοφικής Έρευνας (2011 κ. ε.), μέλος της συντακτικής επιτροπής του περιοδικού: Φιλοσοφείν. Επιστήμη, εύνοια, παρρησία, καθώς και μέλος της επιστημονικής επιτροπής του περιοδικού: Φιλοσοφία και Παιδεία."}]},{id:"lectures",letter:"Γ",heading:"Διαλέξεις",items:[{text:"«Μια εναλλακτική πρόταση για τη διδασκαλία της φιλοσοφίας στη Μέση Εκπαίδευση». Διάλεξη ενώπιον φιλολόγων της Ανατολικής Αττικής, Παλλήνη 11/4/1994. Το κείμενο δημοσιεύτηκε στο περιοδικό «Φιλοσοφία και Παιδεία» 1 (1995), τεύχος 3, σελ. 12-14."},{text:"«Ο θεός του Εμπεδοκλή». Διάλεξη που δόθηκε στην Αθήνα το 1997. Το κείμενο σε επανειλημμένα επεξεργασμένη μορφή δημοσιεύτηκε το 2015 με τίτλο «Ο σφαιρικός θεός του Εμπεδοκλή»."},{text:"«Είναι το καλλιτέχνημα ένα πράγμα ή ένα νόημα;». Διάλεξη που δόθηκε στο Ρέθυμνο, Γκαλερί Αρμονία, 27-11-2002."},{text:"«Ο Μανώλης Μαρκάκης ως φιλόσοφος». Διάλεξη που οργανώθηκε από την Ένωση Φιλολόγων του Νομού Ηρακλείου Κρήτης, Ηράκλειο, 3-3-2003, προς τιμήν του Μανώλη Μαρκάκη (1942-2001), κοινωνιολόγου, φιλόσοφου, ποιητή και συγγραφέα. Δημοσιεύτηκε στο περιοδικό «Διάλογος» (που εκδίδει η Ένωση Φιλολόγων Νομού Ηρακλείου), τεύχος 17, Οκτώβριος 2005, σελ. 203-208."},{text:"«Υπάρχει χρόνος;». Διάλεξη που δόθηκε στο Ρέθυμνο, στο Μουσείο Σύγχρονης Τέχνης Κρήτης – Πινακοθήκη Λευτέρη Κανακάκι, 2-12-2009. Η διάλεξη επαναλήφθηκε στην Αθήνα, στο βιβλιοπωλείο «Πατάκη» (Ακαδημίας 65), στις 11-2-2010, με τίτλο: «Η ύπαρξη του χρόνου κατά τον Αριστοτέλη, τον Καντ και τον Χάιντεγγερ»."}]}]},jg={title:"Επικοινωνία",lead:"Για ακαδημαϊκή αλληλογραφία, προσκλήσεις ή ερωτήματα σχετικά με το έργο.",emailLabel:"Ηλεκτρονικό ταχυδρομείο",email:"itzavar@edc.uoc.gr",locationLabel:"Τοποθεσία",location:"Ρέθυμνο, Κρήτη",note:"Ο ιστότοπος είναι ένα ψηφιακό αρχείο· δεν προβλέπεται μηχανισμός αυτόματης αποστολής μηνυμάτων. Χρησιμοποιήστε το παραπάνω email.",writeButton:"Στείλτε email"},Ag={tagline:"Ένα ψηφιακό αρχείο ιδεών, βιβλίων και φιλοσοφικού στοχασμού.",explore:"Εξερεύνηση",about:"Σχετικά",aboutText:"Προσωπικός ιστότοπος του φιλοσόφου Γιάννη Τζαβάρα. Περιεχόμενο στα ελληνικά, τα αγγλικά και τα γερμανικά.",rights:"Με επιφύλαξη παντός δικαιώματος.",builtWith:"Φτιαγμένο με αγάπη για τη φιλοσοφία."},Cg={meta:yg,nav:vg,ui:kg,home:xg,biography:wg,cv:Sg,chronology:Pg,works:Eg,interests:zg,books:_g,articles:bg,blog:Tg,activities:Ng,contact:jg,footer:Ag},Dg={name:"Giannis Tzavaras",role:"Philosopher · Professor Emeritus of Philosophy",place:"University of Crete, Rethymno"},Mg={home:"Home",biography:"Biography",cv:"Curriculum (CV)",chronology:"Chronology",works:"Work",interests:"Interests",books:"Books",articles:"Articles",blog:"Blog",activities:"Activities",contact:"Contact"},Rg={language:"Language",greek:"Greek",english:"English",german:"German",introduction:"Introduction",notFound:"The page you are looking for was not found.",readMore:"Read more",back:"Back",backToBlog:"Back to the blog",explore:"Explore the work",readBlog:"Read the blog",minRead:"min read",minReadOne:"min read",publishedOn:"Published",tags:"Topics",viewAll:"View all",scroll:"Scroll",menu:"Menu"},Ig={heroKicker:"Greek philosophical thought",heroTitle:"Giannis Tzavaras",heroSubtitle:"Philosopher, translator and teacher. Professor Emeritus of Philosophy at the University of Crete, with a body of work focused on ontology, metaphysics, and the dialogue between Greek thought and German philosophy.",heroQuote:"Philosophy does not give answers; it teaches us how to ask well.",heroQuoteAuthor:"G. Tzavaras",ctaExplore:"Explore the work",ctaBlog:"Recent thoughts",introTitle:"A life among ideas",introParagraphs:["For decades, Giannis Tzavaras has stood between two worlds of thought: the ancient Greek philosophy that first posed the question of Being, and modern German philosophy, which renewed that question in new terms.","His work — as translator, interpreter and original thinker — builds bridges between Plato and Heidegger, between Aristotle and Hegel, in a language that is clear, rigorous and deeply human.","This site gathers his books, articles, biography and most recent reflections — a living archive for anyone who wishes to think alongside him."],highlightsTitle:"Threads of the work",highlights:[{icon:"scroll",title:"Ontology & Metaphysics",text:"The question of the meaning of Being, from the Presocratics to Heidegger."},{icon:"languages",title:"Philosophical translation",text:"Rendering landmark texts of German philosophy into a precise, living Greek."},{icon:"graduation-cap",title:"Teaching",text:"Generations of students at the University of Crete who learned to read texts closely."},{icon:"feather",title:"Essay & reflection",text:"Original writing on language, art, death, and the measure of being human."}],featuredQuote:"To think means: to stay faithful to a question, even when it promises no rest.",featuredQuoteSource:"From lecture notes, Rethymno"},Lg={title:"Biography",lead:"A path from the study of classical texts to the chair of philosophy — and beyond it.",youngCaption:"The early years",paragraphs:["Giannis Tzavaras belongs to the generation of Greek philosophers who, in the second half of the 20th century, set out to bring contemporary European philosophy into fertile dialogue with the Greek tradition. He studied philosophy in Greece and in Germany, where he came into direct contact with the metaphysical and hermeneutic traditions.","His encounter with the work of Martin Heidegger proved decisive. He devoted years to the study and translation of foundational texts, aiming not at a mere transfer of words but at the creation of a Greek philosophical language capable of hosting the most demanding concepts.","As a professor in the Department of Philosophy and Social Studies at the University of Crete, in Rethymno, he taught ontology, the history of philosophy and metaphysics. His teaching was marked by an insistence on careful, slow reading of texts — an exercise in patience and precision.","Today, as Professor Emeritus, he continues to write, translate and reflect, sharing his thoughts through essays and posts on his blog."],timelineTitle:"Milestones",timeline:[{year:"Early years",title:"Studies in philosophy",text:"Foundational studies in classical and modern philosophy, in Greece and in Germany."},{year:"Research",title:"Encounter with metaphysics",text:"Deep engagement with Husserl and Heidegger; the start of a long translation project."},{year:"Teaching",title:"University of Crete, Rethymno",text:"Many years as professor of philosophy; seminars in ontology and hermeneutics."},{year:"Writing",title:"Books & translations",text:"A series of original studies and landmark translations of German philosophy."},{year:"Today",title:"Professor Emeritus",text:"Ongoing writing, essays and public reflection through the blog."}],influencesTitle:"Interlocutors & influences",influences:["Plato","Aristotle","Heraclitus","Immanuel Kant","G. W. F. Hegel","Søren Kierkegaard","Edmund Husserl","Martin Heidegger"]},Hg={title:"Curriculum (CV)",lead:"The studies, academic career and publications of Giannis Tzavaras, in the concise form of a curriculum vitae.",backLink:"Back to Biography",photo:{src:"images/yiannis-2009.jpg",caption:"Giannis Tzavaras, 2009"},detailsHeading:"Details",details:[{label:"Family name",value:"Tzavaras"},{label:"Name",value:"Ioannis"},{label:"Position",value:"Professor Emeritus"},{label:"Specialization",value:"Philosophy with an emphasis on Metaphysics"},{label:"Address",value:"Roussospiti POB 4642, GR–74100 Rethymno"},{label:"Tel.",value:"+30 6945953220"},{label:"E-mail",value:"itzavaras@yahoo.gr"}],sections:[{heading:"Education",entries:[{label:"Undergraduate",text:"University of Athens, School of Philosophy, Department of Philosophy: 1968–1973."},{label:"Post-graduate",text:"Specialization in Philosophy: a) Göttingen (Germany), winter semester 1973–74; b) Munich (Germany), spring semester 1974 – spring semester 1978."},{label:"Doctorate",text:"University of Munich, 1974–1978. Doctoral thesis: “Motion according to Kierkegaard”."}]},{heading:"University Teaching (University of Crete)",entries:[{label:"Contract appointment",text:"1979–1984"},{label:"Assistant Professor",text:"1984–1990"},{label:"Associate Professor",text:"1991–1997"},{label:"Professor",text:"1997–2014"}]}],publications:{heading:"Publications",booksHeading:"Books",books:["1. *Motion according to Kierkegaard* (in German). Verlag Peter Lang, Frankfurt a.M. 1978, 122 pp.","2. *The Poem of Parmenides* (in Greek). Domos, Athens 1980, 241 pp.","3. *The Certainty of Death* (in Greek). Dodoni, Athens – Ioannina 1982, 118 pp.","4. *The Poetry of Empedocles* (Ancient text – Translation – Commentary) (in Greek). Dodoni, Athens – Ioannina 1988, 303 pp.","5. *The Kantian Time according to Heidegger* (in Greek). Dodoni, Athens – Ioannina 1989, 101 pp.","6. *Love – War. An Essay on Cosmic Theory* (in Greek). Dodoni, Athens – Ioannina 1993, 172 pp.","7. *A Companion to Philosophy* (in Greek). Editions of Kosteas-Geitonas School, Athens 1995, 156 pp. (2nd edition, Rethymno 2001. 3rd edition totally renewed, Typothito-G. Dardanos, Athens 2006, 319 pp.).","8. *The Universal Diffusion of Despair* (Study on Kierkegaard) (in Greek). Dodoni, Athens – Ioannina 1997, 202 pp.","9. *Problems in the Philosophy of Education* (in Greek). Rethymno 2000, 172 pp.","10. *The Demerit of Values: Nietzsche and Heidegger* (in Greek). Indictos, Athens 2005, 237 pp.","11. *Theology and Philosophy according to the Early Heidegger* (in Greek). Indictos, Athens 2007, 125 pp.","12. *An Anthology of Aesthetics* (in Greek). Gutenberg, Athens 2007, 175 pp.","13. *An Introduction to Ontology* (in Greek). Gutenberg, Athens 2009, 186 pp.","14. *Philosophical Dialogue in the Classroom. Proceedings of a Congress (Rethymno, 22-10-2010)* (in Greek).","15. *Nietzsches Notizen zum Zarathustra (Juli 1882 – Februar 1883)* (in Greek). e-book, 2011.","16. *Heideggers «Beiträge zur Philosophie». Ein Zugangsversuch* (in Greek). e-book, 2012.","17. *Existentielles und denkerisches Werden bei Kierkegaard* (in Greek). e-book, 2013."],groups:[{label:"Papers & editions",text:"Many papers, book reviews, bibliographical works and editions."},{label:"Translations & commentaries",text:"Translations and commentaries on philosophical works of: Sören Kierkegaard, Martin Heidegger, Immanuel Kant, Paul Feyerabend, Georg Hegel, Plotinos, Thomas Aquinas, Joanna Haynes, Rainer Maria Rilke, Friedrich Hölderlin."}]},sourceLabel:"Read more on the personal website",sourceUrl:"https://istoselidatzavara.webnode.page/tzavaras-john-curriculum-cv-/"},Gg={title:"Chronology",lead:"From his birth in 1950 to the present: studies, academic milestones, and his writing and translation work, year by year.",note:"A complete chronology of life, studies, appointments and publications.",milestoneLabel:"Milestone"},Bg={title:"The work",lead:"Four interwoven threads compose a single philosophical path.",areas:[{title:"Ontology",text:"At the centre of the work lies philosophy's oldest question: what does it mean 'to be'? Through the Presocratics, Plato and Aristotle, and up to the modern reformulation of the question, the meaning of existence itself is sought."},{title:"Metaphysics & Hermeneutics",text:"The method of 'returning to the things themselves' and the art of interpretation lead to a philosophy that imposes no schemes, but lets the phenomena show themselves."},{title:"Philosophy of language",text:"Language is not a mere tool but the place where meaning becomes possible. Translation thus becomes a philosophical act in itself — the search for the right word as the search for truth."},{title:"Ethics & the human measure",text:"Beyond theory, the question remains: how ought one to live? Death, time, freedom and responsibility define the horizon of a reflective life."}]},Fg={title:"Interests",lead:"The fields that shaped the thought and work of Giannis Tzavaras — from ancient Greek philosophy to aesthetic education — together with the related books, translations and scholarly papers.",photos:[{src:"images/foto-giannis.jpg",caption:"Giannis Tzavaras"},{src:"images/giannis-rubik.jpg",caption:"Play and thought — the puzzle as a challenge"}],sections:[{letter:"A",heading:"Ancient Greek Philosophy",groups:[{label:"Related books",items:["*The Poem of Parmenides* (1980)","*The Poetry of Empedocles* (1988)","Plotinus: *The “Great Book”* (= Enneads 30–33) (1995)"]}]},{letter:"B",heading:"Ontology – Metaphysics",groups:[{label:"Related books",items:["*Bewegung bei Kierkegaard* (1978)","*The Kantian Time according to Heidegger* (1989)","*Love – War. An Essay on Cosmic Theory* (1993)","*The Demerit of Values: Nietzsche and Heidegger* (2005)","*An Introduction to Ontology* (2009)","Translations of ontological–metaphysical books by Thomas Aquinas, Heidegger, Kant and Hegel."]}]},{letter:"C",heading:"Philosophy of Education",groups:[{label:"Related book",items:["*Problems in the Philosophy of Education* (1st edition, Rethymno 2000; 2nd edition, e-book, 2015)."]},{label:"Related scholarly paper",items:["“Democratic education as an experience of collective self-institution and self-management”. A paper at the academic symposium “The crisis of democracy as a crisis of democratic education” (Alexandroupoli, 8–9 November 2013)."]}]},{letter:"D",heading:"Didactics of Philosophy",groups:[{label:"Related books",items:["*A Companion to Philosophy* (1995, 2001, 2006)","Translation of: Joanna Haynes, *Children as Philosophers* (2009)"]}]},{letter:"E",heading:"Aesthetics and Aesthetic Education",groups:[{label:"Related works",items:["M. Heidegger, *The Origin of the Work of Art*. Translated by G. Tzavaras (1986).","*An Anthology of Aesthetics* (2007)","The journal *Aesthetic Education* (2002–2014).","“The diffusion of inter-artistic knowledge through a website. General principles”. A scholarly paper at the International Workshop “Towards a new inter-artistic and intercultural approach through the use of new technology”, organised by the Laboratory of Artistic and Cultural Education of the Department of Primary Education of the University of the Aegean (Rhodes, 5 February 2011). Published in the proceedings of the workshop."]}]}]},Og={title:"Books & Bibliography",lead:"The independent books of Giannis Tzavaras — studies, essays, and annotated or bilingual editions. Each title shows its publisher and year.",note:"Independent books only; titles are given in their original language (Greek / German).",countLabel:"books",pagesLabel:"pp.",tabBooks:"Books",tabTranslations:"Translations",translationsLead:"Philosophical works translated by Giannis Tzavaras — from Kierkegaard and Heidegger to Kant, Hegel, Plotinus and Schelling. Each title shows its publisher and year.",translationsNote:"Translations of other thinkers’ works; titles are given in the language of the edition.",translationsCountLabel:"translations"},Kg={title:"Articles & Publications",lead:"A selection of scholarly articles, essays and contributions to edited volumes and journals.",items:[{year:"1974",title:"«Προβλήματα και προτάσεις για μια νεοελληνική μετάφραση του Sein und Zeit του Μάρτιν Χάιντεγγερ»",source:"*Φιλοσοφία. Επετηρίς του Κέντρου Φιλοσοφίας της Ακαδημίας Αθηνών* 4 (1974), 449-458."},{year:"1978",title:"«Η ριζική αναγκαιότητα κατά τον Χάιντεγγερ. Μια προσπάθεια για πρόσβαση στο Είναι και χρόνος»",source:"*Εποπτεία* 29 (1978), 955-960."},{year:"1979",title:"«Ένα κείμενο του Αριστοτέλη για την αλήθεια. Των Μετά τα Φυσικά Θ 10»",source:"*Εποπτεία* 34 (1979), 415-428."},{year:"1979",title:"«Η σχέση της αμφιβολίας προς το σκέπτεσθαι και την πίστη στον Κίρκεγκωρ»",source:"*Φιλοσοφία. Επετηρίς του Κέντρου Ερεύνης της Ελληνικής Φιλοσοφίας της Ακαδημίας Αθηνών* 8-9 (1978-79), 401-418."},{year:"1984",title:"«Η απεραντοσύνη του χρόνου. Έρευνα στον Αριστοτέλη»",source:"*Αριάδνη. Επετηρίδα της Φιλοσοφικής Σχολής του Πανεπιστημίου Κρήτης* 2 (1984), 126-139."},{year:"1985",title:"«Ο Ζαρατούστρα του Νίτσε ως κήρυκας του ολέθρου»",source:"*Φιλοσοφία. Επετηρίς του Κέντρου Ερεύνης της Ελληνικής Φιλοσοφίας της Ακαδημίας Αθηνών* 15-16 (1985-86), 398-443."},{year:"1988",title:"«Διαλεκτική κίνηση στη φιλοσοφία της τέχνης του Χάιντεγγερ»",source:"Συμμετοχή στο 3ο Πανελλήνιο συνέδριο της Ελληνικής Φιλοσοφικής Εταιρείας («Η έννοια της διαλεκτικής», 1986). Στον τόμο: *Η διαλεκτική*, Ελληνική Φιλοσοφική Εταιρεία, Αθήνα 1988, 383-387."},{year:"1989",title:"“Heideggers Unterscheidung zwischen Zuhandenheit und Vorhandenheit”",source:"*Philosophisches Jahrbuch* 96 (1989), 367-371. (Ελληνική μετάφραση 2015: «Η διάκριση του Χάιντεγγερ μεταξύ πρόχειρων και παρευρισκόμενων όντων».)"},{year:"1990",title:"«Η θεμελιώδης Οντολογία του Μάρτιν Χάιντεγγερ»",source:"Συμμετοχή στο Συμπόσιο «Χάιντεγγερ και Αντόρνο – ο διάλογος που δεν πραγματοποιήθηκε» (Ινστιτούτο Γκαίτε Αθηνών, 22-24 Νοεμβρίου 1989). *Λεβιάθαν* 8 (1990), 21-26."},{year:"1991",title:"«Ο χρόνος της καθημερινότητας στον Αριστοτέλη και στον Heidegger»",source:"*Ζήνων* 10-12 (1989-91), 15-19."},{year:"1992",title:"«Πυθαγόρειες επιδράσεις στη φιλοσοφία του Εμπεδοκλή»",source:"Ανακοίνωση στο 3ο Διεθνές Συνέδριο Ελληνικής Φιλοσοφίας (Σάμος, 22-26/8/1991). Στον τόμο: Κωνσταντίνος Βουδούρης (επιμ.), *Πυθαγόρεια Φιλοσοφία*, Αθήνα-Σάμος 1992, 189-194."},{year:"1994",title:"«Ο εξωπραγματικός χαρακτήρας του καλλιτεχνήματος κατά τον Martin Heidegger»",source:"Συμμετοχή στο 6ο Πανελλήνιο συνέδριο της Ελληνικής Φιλοσοφικής Εταιρείας («Αισθητική και Φιλοσοφία της τέχνης», Αθήνα 18-20/5/1994). Στον τόμο: Παύλος Χριστοδουλίδης (επιμ.), *Αισθητική και θεωρία της τέχνης*, Εκδόσεις Καρδαμίτσα, Αθήνα 1994, 179-183."},{year:"1994",title:"«Το διονυσιακό στοιχείο κατά τον πρώιμο Νίτσε»",source:"Ανακοίνωση στην εκδήλωση «Ο Νίτσε και η Ελλάδα» (Ινστιτούτο Γκαίτε Αθηνών & Γαλλικό Ινστιτούτο Αθηνών, 8-9/12/1994)."},{year:"1995",title:"«Μια εναλλακτική πρόταση για τη διδασκαλία της φιλοσοφίας στη Μέση Εκπαίδευση»",source:"Διάλεξη ενώπιον φιλολόγων της Ανατολικής Αττικής (Παλλήνη, 11/4/1994). *Φιλοσοφία και Παιδεία* 1 (1995), τεύχος 3, 12-14."},{year:"1995",title:"«Ο διάλογος ως μελλοντική φιλοσοφική μέθοδος»",source:"Στον τόμο: *Παρόν και μέλλον της φιλοσοφίας* (Πανεπιστήμιο Κρήτης, Τομέας Φιλοσοφίας), Αθήνα-Γιάννινα 1995, 77-84."},{year:"1996",title:"“Craft and Craftsman According to Plato”",source:"Εισήγηση σε διεθνές σεμινάριο «Τεχνολογία και γνώση. Φιλοσοφικές και κοινωνιολογικές διερευνήσεις», Ρέθυμνο 17-18 Οκτωβρίου 1996."},{year:"1998",title:"«Η ιατρο-θεολογική φιλοσοφία του ύστερου Kierkegaard και οι ιστορικές καταβολές της»",source:"Ανακοίνωση στο συνέδριο «Ιατρική και φιλοσοφία» (Κως-Κάλυμνος, Αύγουστος 1997). Στον τόμο: Κωνσταντίνος Βουδούρης (επιμ.), *Φιλοσοφία και ιατρική*, Αθήνα 1998, 297-301."},{year:"1999",title:"«Χάιντεγγερ και Αναξίμανδρος»",source:"*Διαβάζω* 399 (1999), 121-124."},{year:"2001",title:"«Ένα καινούριο απόσπασμα από την ποίηση του Εμπεδοκλή»",source:"Εισήγηση σε διεθνές συνέδριο για τα νέα αποσπάσματα του Εμπεδοκλή (Παρίσι, 26-27 Μαΐου 2000). *Ελληνική Φιλοσοφική Επιθεώρηση* 18 (2001), 45-57."},{year:"2001",title:"«Φιλοσοφία της παιδείας στον Ηράκλειτο»",source:"Εισήγηση στο Β΄ Διεθνές Συνέδριο Φιλοσοφίας, Πανεπιστήμιο Κύπρου, Λευκωσία, 5-7 Απριλίου 2001."},{year:"2002",title:"«Αληθινά και ψευδή παραμύθια κατά τον Πλάτωνα»",source:"Εισήγηση σε Διεθνές Συνέδριο του Παιδαγωγικού Τμήματος Π.Ε. του Πανεπιστημίου Κρήτης (18-20/10/2001). Στον τόμο: *Ψυχοπαιδαγωγική της Προσχολικής Ηλικίας*, Ρέθυμνο 2002, τόμος Β΄, 706-709."},{year:"2002",title:"«Αξιώματα διαπαιδαγώγησης του μικρού παιδιού στον Αιμίλιο του Ρουσσώ»",source:"Στον τόμο: Ευαγγελία Κούρτη (επιμ.), *Η έρευνα στην προσχολική εκπαίδευση*, τόμος Γ΄, Εκδόσεις Τυπωθήτω – Γ. Δαρδανός, Αθήνα 2002, 217-223."},{year:"2004",title:"«Η αγωνία ως μέσο ηθικο-θρησκευτικής διαπαιδαγώγησης κατά τον Κίρκεγκωρ»",source:"Στον τόμο: *Ηθική και θρησκευτική ανάπτυξη και αγωγή του παιδιού*, Πανεπιστήμιο Κρήτης, Ρέθυμνο 2004, 584-588."},{year:"2005",title:"“Heideggers Hauptwerk in Neugriechisch”",source:"*Studia Phaenomenologica* 5 (2005), 119-127."},{year:"2007",title:"«Αισθητική Αγωγή μέσω φιλοσοφικών κειμένων»",source:"*Φιλοσοφία και Παιδεία* 41 (2007), 16-18."},{year:"2008",title:"«Ο συγκαιρινός και ο κατοπινός μαθητής κατά τον Κίρκεγκωρ»",source:"*Φιλοσοφία και Παιδεία* 49-50 (2008), 4-6."},{year:"2010",title:"«Μεταφράζοντας το Dasein του Martin Heidegger»",source:"Στο: *Ευβουλία. Αφιέρωμα στον ομότιμο καθηγητή Βασίλειο Α. Κύρκο* (επιμ. Κωνσταντίνος Θ. Πέτσιος), Ιωάννινα 2010, 255-262."},{year:"2012",title:"«Η στοχαστική διαλογική δραστηριότητα ως έξοχη ευκαιρία για εκδημοκρατισμό του σχολικού αναλυτικού προγράμματος»",source:"Πρακτικά ημερίδας (Ρέθυμνο, 22-10-2010), 1-8. Αναδημοσιεύτηκε στο *Διά-ΛΟΓΟΣ* 2 (2012), 294-304."},{year:"2012",title:"«Η ανθρώπινη μοίρα κατά τον Heidegger»",source:"*Φιλοσοφείν* 5 (2012), 188-210."},{year:"2013",title:"«Η τελεολογική αναστολή της ηθικότητας κατά τον Kierkegaard. Μια υπεράσπιση»",source:"*Φιλοσοφία. Επετηρίς του Κέντρου Ερεύνης της Ελληνικής Φιλοσοφίας της Ακαδημίας Αθηνών* 43 (2013), 365-380."},{year:"2013",title:"«Η δημοκρατική εκπαίδευση ως εμπειρία συλλογικής αυτοθέσμισης και αυτοδιαχείρισης»",source:"Ανακοίνωση στην επιστημονική διημερίδα «Η κρίση της δημοκρατίας ως κρίση της δημοκρατικής παιδείας» (Αλεξανδρούπολη, 8-9/11/2013)."},{year:"2014",title:"«Κράτος και εκπαίδευση κατά τον πρώιμο Νίτσε»",source:"*Φιλοσοφία και Παιδεία* 66-67 (2014), 4-7."},{year:"2015",title:"«Ο σφαιρικός θεός του Εμπεδοκλή»",source:"*Φιλοσοφικά Δημοσιεύματα 2015*, 1-18."},{year:"2016",title:"«Νεότερες περιπέτειες του νόμου της αιτιότητας»",source:"*Φιλοσοφείν: επιστήμη, εύνοια, παρρησία* 14 (2016), 399-409."},{year:"2017",title:"«Εμπειρία θανάτου κατά τον Ρίλκε»",source:"*Φιλοσοφείν: επιστήμη, εύνοια, παρρησία* 15 (2017), 355-374."},{year:"2018",title:"«Ο χρόνος κατά τον Αίαντα του Σοφοκλή»",source:"*Φιλοσοφείν: επιστήμη, εύνοια, παρρησία* 18 (Ιούνιος 2018), 227-238."},{year:"2019",title:"«Η ουσία της σύγχρονης τέχνης κατά τον Heidegger»",source:"*Ελληνική Φιλοσοφική Επιθεώρηση* 108 (2019), 210-225."},{year:"2021",title:"«Μικρή Λογική» (Χέγκελ)",source:"*Βικιπαίδεια*, Μάιος 2021."}]},Ug={title:"Blog",lead:"Thoughts, notes and short essays — written to the rhythm of daily study.",posts:[{id:"i-techni-tis-argis-anagnosis",date:"2026-05-18",title:"The art of slow reading",tags:["education","reading","method"],excerpt:"In a world that reads ever faster, philosophy insists on the opposite: on patience.",body:["When I teach, I often tell my students that a philosophical text is not read; it is inhabited. We do not hurry through it as through a corridor. We stay, we look again, we let the words open up.","Slow reading is not an end in itself. It is method. To study a single page of Aristotle or Heidegger may require an entire day — and this is not a failure, it is the right rhythm.","Perhaps the most revolutionary thing a young person can do today is exactly this: to sit with a difficult book and not be in a hurry."]},{id:"giati-metafrazoume",date:"2026-03-02",title:"Why we translate philosophy",tags:["translation","language"],excerpt:"Every translation is an interpretation, and every interpretation a decision about what truth means.",body:["People often ask me why I devoted so many years to translating texts that few will read. My answer is simple: translation is the slowest and the most faithful way of reading.","To translate a single word of Heidegger, you must understand it to the end. It is not enough to know what it means; you must find how the same thought sounds in your own language.","In this way the Greek language does not merely receive a foreign idea — it changes too, it grows, it discovers new possibilities. This is the true gain of translation."]},{id:"to-erotima-pou-menei",date:"2026-01-11",title:"The question that remains",tags:["ontology","reflection"],excerpt:"Philosophy does not accumulate answers; it cultivates a question that never ceases.",body:["After a life among books, I confess that I hold no more certainties than I did in my youth. But I have better questions.","The question of Being — why there is something rather than nothing — has never been solved, and perhaps it should not be. Its value lies not in the answer but in the fact that it keeps us awake.","This is what I try to leave to my students: not a system, but a capacity to be astonished before the fact that the world exists."]}]},Wg={title:"Broader Activities",lead:"Websites, academic and institutional activities, and lectures by Giannis Tzavaras.",sourceLabel:"Read more on the personal website",sourceUrl:"https://istoselidatzavara.webnode.page/%ce%b5%cf%85%cf%81%cf%8d%cf%84%ce%b5%cf%81%ce%b5%cf%82%20%ce%b4%cf%81%ce%b1%cf%83%cf%84%ce%b7%cf%81%ce%b9%cf%8c%cf%84%ce%b7%cf%84%ce%b5%cf%82/",sections:[{id:"websites",letter:"A",heading:"Websites of Giannis Tzavaras",items:[{text:"Greek Philosophical Bibliography 1980–2019. An archive of Greek-language philosophical bibliography.",url:"https://tzavaras-ioannis.blogspot.com/2022/05/blog-post_9.html"},{text:"Aesthetic Education (Aisthitiki Agogi). A biannual student journal (published without interruption from October 2002 to October 2014), edited by Giannis Tzavaras with graphic design by Konstantinos Nyktaris. It mainly featured seminar papers from the Aesthetic Education seminar supervised by G. Tzavaras. It published original texts covering a broad field: A) theories of art, the beautiful and related concepts; B) works of art (their analysis and evaluation); C) the history of art; D) aesthetic cultivation and artistic education. Its interest focused especially on the area of pre-school and early-school education.",url:"http://periodikoaisthag.webnode.com"},{text:"Shadow Theatre and Education. An effort to make known to the Greek public the educational possibilities of Shadow Theatre beyond the traditional Karagiozis.",url:"http://theatroskivvn.yolasite.com"},{text:"Philosophy for Children. An effort to introduce to the Greek public the international philosophical–pedagogical movement “philosophy for children”.",url:"https://childrenandphilosophy.webnode.com"},{text:"“Philosophical Publications” (Filosofika Dimosievmata). Online publication of Greek-language philosophical texts from 2011 onwards.",url:"https://www.philosophicalbibliography.com/index.php?option=com_content&view=article&id=5%3Afilosofika-dimosieymata"}]},{id:"other",letter:"B",heading:"Other activities",items:[{text:"He served as alternate representative of the University of Crete on the Prefectural Committee for Popular Education (N.E.L.E.) of the Prefecture of Rethymno for a two-year term (1985–1987)."},{text:"He contributed to the organisation of the following conferences: A) “Wittgenstein Philosophical Symposium”, 15–17 December 1989. B) “The Present and Future of Philosophy”. A two-day philosophical symposium, Orthodox Academy of Crete, November 1991. C) “Technology and Knowledge. Philosophical and Sociological Investigations”. A two-day international seminar, Rethymno, 17–18 October 1996."},{text:"During the academic year 1993–1994 he served as Chair of the Department of Philosophy and Social Studies, and during the academic years 2005–2007 as Chair of the Department of Pre-school Education of the University of Crete."},{text:"For several years he supervised, as principal supervisor, the doctoral thesis of Kostas Kourpetis on “Man and God in Empedocles”. The thesis was successfully defended (grade: excellent) in June 1996."},{text:"He was a member of many three-member committees set up to supervise Master’s specialisation theses and doctoral dissertations (PhD). In addition, he examined numerous doctoral theses as a member of their seven-member examination committee."},{text:"He was a member of many electoral bodies set up to judge the election or promotion of faculty members of the University of Crete and other Greek universities."},{text:"During 1993–1997 he was a regular member of the Research Committee (E.L.K.E.) of the University of Crete as representative of the Department of Philosophy and Social Studies."},{text:"For several years he served as Deputy Chair of the Department of Philosophy and Social Studies and of the Department of Pre-school Education of the University of Crete."},{text:"For several years (1998–2005) he served as Vice-President of the Nursery Teachers’ Training College of the University of Crete, and during 2005–2007 as President of the same College."},{text:"He organised an academic workshop on: “From the teacher’s monologue to group dialogue. Philosophical thought and inquiry in the primary-school classroom” (Rethymno, 22 October 2010). The proceedings of the workshop, with enriched and improved versions of the participants’ papers, were published in the journal Dia-LOGOS 2 (2012), pp. 181–339."},{text:"He was a member of the Quality Assurance Unit (MO.DI.P.) of the University of Crete from 2010 to 2012."},{text:"He was co-editor of the journal Dia-LOGOS. Yearbook of Philosophical Research (2011 onwards), a member of the editorial committee of the journal Filosofein. Episteme, eunoia, parrhesia, and a member of the scientific committee of the journal Philosophy and Education."}]},{id:"lectures",letter:"C",heading:"Lectures",items:[{text:"“An alternative proposal for the teaching of philosophy in Secondary Education”. A lecture before philologists of East Attica, Pallini, 11 April 1994. The text was published in the journal “Philosophy and Education” 1 (1995), issue 3, pp. 12–14."},{text:"“The God of Empedocles”. A lecture given in Athens in 1997. The text, in a repeatedly reworked form, was published in 2015 under the title “The spherical god of Empedocles”."},{text:"“Is the artwork a thing or a meaning?”. A lecture given in Rethymno, Armonia Gallery, 27 November 2002."},{text:"“Manolis Markakis as a philosopher”. A lecture organised by the Union of Philologists of the Prefecture of Heraklion, Crete, Heraklion, 3 March 2003, in honour of Manolis Markakis (1942–2001), sociologist, philosopher, poet and writer. Published in the journal “Dialogos” (issued by the Union of Philologists of the Prefecture of Heraklion), issue 17, October 2005, pp. 203–208."},{text:"“Does time exist?”. A lecture given in Rethymno, at the Museum of Contemporary Art of Crete – L. Kanakakis Gallery, 2 December 2009. The lecture was repeated in Athens, at the “Patakis” bookshop (65 Akadimias St.), on 11 February 2010, under the title: “The existence of time according to Aristotle, Kant and Heidegger”."}]}]},Vg={title:"Contact",lead:"For academic correspondence, invitations, or questions about the work.",emailLabel:"Email",email:"itzavar@edc.uoc.gr",locationLabel:"Location",location:"Rethymno, Crete",note:"This site is a digital archive; there is no automated message-sending mechanism. Please use the email above.",writeButton:"Send an email"},$g={tagline:"A digital archive of ideas, books and philosophical reflection.",explore:"Explore",about:"About",aboutText:"Personal website of the philosopher Giannis Tzavaras. Content in Greek, English and German.",rights:"All rights reserved.",builtWith:"Made with love for philosophy."},Zg={meta:Dg,nav:Mg,ui:Rg,home:Ig,biography:Lg,cv:Hg,chronology:Gg,works:Bg,interests:Fg,books:Og,articles:Kg,blog:Ug,activities:Wg,contact:Vg,footer:$g},Qg={name:"Giannis Tzavaras",role:"Philosoph · Emeritierter Professor für Philosophie",place:"Universität Kreta, Rethymno"},Jg={home:"Startseite",biography:"Biografie",cv:"Lebenslauf (CV)",chronology:"Chronologie",works:"Werk",interests:"Interessen",books:"Bücher",articles:"Artikel",blog:"Blog",activities:"Aktivitäten",contact:"Kontakt"},Yg={language:"Sprache",greek:"Griechisch",english:"Englisch",german:"Deutsch",introduction:"Einführung",notFound:"Die gesuchte Seite wurde nicht gefunden.",readMore:"Mehr lesen",back:"Zurück",backToBlog:"Zurück zum Blog",explore:"Das Werk erkunden",readBlog:"Den Blog lesen",minRead:"Min. Lesezeit",minReadOne:"Min. Lesezeit",publishedOn:"Veröffentlicht",tags:"Themen",viewAll:"Alle ansehen",scroll:"Scrollen",menu:"Menü"},Xg={heroKicker:"Griechisches philosophisches Denken",heroTitle:"Giannis Tzavaras",heroSubtitle:"Philosoph, Übersetzer und Lehrer. Emeritierter Professor für Philosophie an der Universität Kreta, mit einem Werk, das auf die Ontologie, die Metaphysik und den Dialog zwischen griechischem Denken und deutscher Philosophie ausgerichtet ist.",heroQuote:"Die Philosophie gibt keine Antworten; sie lehrt uns, gut zu fragen.",heroQuoteAuthor:"G. Tzavaras",ctaExplore:"Das Werk erkunden",ctaBlog:"Aktuelle Gedanken",introTitle:"Ein Leben unter Ideen",introParagraphs:["Seit Jahrzehnten steht Giannis Tzavaras zwischen zwei Welten des Denkens: der altgriechischen Philosophie, die zuerst die Frage nach dem Sein stellte, und der modernen deutschen Philosophie, die diese Frage in neuen Begriffen erneuerte.","Sein Werk — als Übersetzer, Interpret und eigenständiger Denker — schlägt Brücken zwischen Platon und Heidegger, zwischen Aristoteles und Hegel, in einer Sprache, die klar, streng und zutiefst menschlich ist.","Diese Seite versammelt seine Bücher, Artikel, seine Biografie und seine jüngsten Überlegungen — ein lebendiges Archiv für alle, die mit ihm denken möchten."],highlightsTitle:"Stränge des Werks",highlights:[{icon:"scroll",title:"Ontologie & Metaphysik",text:"Die Frage nach dem Sinn des Seins, von den Vorsokratikern bis zu Heidegger."},{icon:"languages",title:"Philosophische Übersetzung",text:"Wegweisende Texte der deutschen Philosophie in ein präzises, lebendiges Griechisch übertragen."},{icon:"graduation-cap",title:"Lehre",text:"Generationen von Studierenden an der Universität Kreta, die das genaue Lesen von Texten lernten."},{icon:"feather",title:"Essay & Reflexion",text:"Eigenständiges Schreiben über Sprache, Kunst, Tod und das Maß des Menschseins."}],featuredQuote:"Denken heißt: einer Frage treu zu bleiben, auch wenn sie keine Ruhe verspricht.",featuredQuoteSource:"Aus Vorlesungsnotizen, Rethymno"},qg={title:"Biografie",lead:"Ein Weg vom Studium der klassischen Texte bis zum Lehrstuhl für Philosophie — und darüber hinaus.",youngCaption:"Die frühen Jahre",paragraphs:["Giannis Tzavaras gehört zu jener Generation griechischer Philosophen, die in der zweiten Hälfte des 20. Jahrhunderts daran gingen, die zeitgenössische europäische Philosophie in einen fruchtbaren Dialog mit der griechischen Tradition zu bringen. Er studierte Philosophie in Griechenland und in Deutschland, wo er in unmittelbaren Kontakt mit der metaphysischen und der hermeneutischen Tradition kam.","Seine Begegnung mit dem Werk Martin Heideggers erwies sich als entscheidend. Er widmete Jahre dem Studium und der Übersetzung grundlegender Texte, mit dem Ziel, nicht bloß Worte zu übertragen, sondern eine griechische philosophische Sprache zu schaffen, die den anspruchsvollsten Begriffen ein Zuhause geben kann.","Als Professor am Institut für Philosophie und Sozialwissenschaften der Universität Kreta in Rethymno lehrte er Ontologie, Philosophiegeschichte und Metaphysik. Seine Lehre war geprägt vom Beharren auf der sorgfältigen, langsamen Lektüre der Texte — einer Übung in Geduld und Genauigkeit.","Heute, als emeritierter Professor, schreibt, übersetzt und denkt er weiter und teilt seine Gedanken in Essays und Beiträgen auf seinem Blog."],timelineTitle:"Meilensteine",timeline:[{year:"Frühe Jahre",title:"Philosophiestudium",text:"Grundlegende Studien der klassischen und modernen Philosophie, in Griechenland und in Deutschland."},{year:"Forschung",title:"Begegnung mit der Metaphysik",text:"Vertiefte Auseinandersetzung mit Husserl und Heidegger; der Beginn eines langjährigen Übersetzungsprojekts."},{year:"Lehre",title:"Universität Kreta, Rethymno",text:"Viele Jahre als Professor für Philosophie; Seminare zu Ontologie und Hermeneutik."},{year:"Schreiben",title:"Bücher & Übersetzungen",text:"Eine Reihe eigenständiger Studien und wegweisender Übersetzungen der deutschen Philosophie."},{year:"Heute",title:"Emeritierter Professor",text:"Fortgesetztes Schreiben, Essays und öffentliches Nachdenken über den Blog."}],influencesTitle:"Gesprächspartner & Einflüsse",influences:["Platon","Aristoteles","Heraklit","Immanuel Kant","G. W. F. Hegel","Søren Kierkegaard","Edmund Husserl","Martin Heidegger"]},e1={title:"Lebenslauf (CV)",lead:"Studium, akademische Laufbahn und Veröffentlichungen von Giannis Tzavaras in der knappen Form eines Lebenslaufs.",backLink:"Zurück zur Biografie",photo:{src:"images/yiannis-2009.jpg",caption:"Giannis Tzavaras, 2009"},detailsHeading:"Angaben",details:[{label:"Familienname",value:"Tzavaras"},{label:"Vorname",value:"Ioannis"},{label:"Position",value:"Emeritierter Professor"},{label:"Fachgebiet",value:"Philosophie mit Schwerpunkt Metaphysik"},{label:"Adresse",value:"Roussospiti POB 4642, GR–74100 Rethymno"},{label:"Tel.",value:"+30 6945953220"},{label:"E-Mail",value:"itzavaras@yahoo.gr"}],sections:[{heading:"Ausbildung",entries:[{label:"Grundstudium",text:"Universität Athen, Philosophische Fakultät, Institut für Philosophie: 1968–1973."},{label:"Aufbaustudium",text:"Spezialisierung in Philosophie: a) Göttingen (Deutschland), Wintersemester 1973–74; b) München (Deutschland), Sommersemester 1974 – Sommersemester 1978."},{label:"Promotion",text:"Universität München, 1974–1978. Dissertation: „Bewegung bei Kierkegaard“."}]},{heading:"Universitäre Lehre (Universität Kreta)",entries:[{label:"Lehrauftrag",text:"1979–1984"},{label:"Juniorprofessor",text:"1984–1990"},{label:"Außerordentlicher Professor",text:"1991–1997"},{label:"Professor",text:"1997–2014"}]}],publications:{heading:"Veröffentlichungen",booksHeading:"Bücher",books:["1. *Bewegung bei Kierkegaard* (auf Deutsch). Verlag Peter Lang, Frankfurt a.M. 1978, 122 S. (Dissertation).","2. *Das Gedicht des Parmenides* (auf Griechisch). Domos, Athen 1980, 241 S.","3. *Die Gewissheit des Todes* (auf Griechisch). Dodoni, Athen – Ioannina 1982, 118 S.","4. *Die Dichtung des Empedokles* (Urtext – Übersetzung – Kommentar) (auf Griechisch). Dodoni, Athen – Ioannina 1988, 303 S.","5. *Die kantische Zeit nach Heidegger* (auf Griechisch). Dodoni, Athen – Ioannina 1989, 101 S.","6. *Liebe – Krieg. Ein Essay zur Weltanschauung* (auf Griechisch). Dodoni, Athen – Ioannina 1993, 172 S.","7. *Handbuch der Philosophie* (auf Griechisch). Kosteas-Geitonas-Schule, Athen 1995, 156 S. (2. Auflage, Rethymno 2001. 3., grundlegend überarbeitete Auflage, Typothito – G. Dardanos, Athen 2006, 319 S.).","8. *Die universale Verbreitung der Verzweiflung* (Studie zu Kierkegaard) (auf Griechisch). Dodoni, Athen – Ioannina 1997, 202 S.","9. *Probleme der Bildungsphilosophie* (auf Griechisch). Rethymno 2000, 172 S.","10. *Die Entwertung der Werte: Nietzsche und Heidegger* (auf Griechisch). Indiktos, Athen 2005, 237 S.","11. *Theologie und Philosophie beim frühen Heidegger* (auf Griechisch). Indiktos, Athen 2007, 125 S.","12. *Anthologie der Ästhetik* (auf Griechisch). Gutenberg, Athen 2007, 175 S.","13. *Einführung in die Ontologie* (auf Griechisch). Gutenberg, Athen 2009, 186 S.","14. *Philosophischer Dialog im Schulunterricht. Tagungsband (Rethymno, 22.10.2010)* (auf Griechisch).","15. *Nietzsches Notizen zum Zarathustra (Juli 1882 – Februar 1883)* (auf Griechisch). E-Book, 2011.","16. *Heideggers «Beiträge zur Philosophie». Ein Zugangsversuch* (auf Griechisch). E-Book, 2012.","17. *Existentielles und denkerisches Werden bei Kierkegaard* (auf Griechisch). E-Book, 2013."],groups:[{label:"Aufsätze & Editionen",text:"Zahlreiche Aufsätze, Rezensionen, bibliografische Arbeiten und Editionen."},{label:"Übersetzungen & Kommentare",text:"Übersetzungen und Kommentare zu philosophischen Werken von: Sören Kierkegaard, Martin Heidegger, Immanuel Kant, Paul Feyerabend, Georg Hegel, Plotin, Thomas von Aquin, Joanna Haynes, Rainer Maria Rilke, Friedrich Hölderlin."}]},sourceLabel:"Mehr auf der persönlichen Website lesen",sourceUrl:"https://istoselidatzavara.webnode.page/tzavaras-john-curriculum-cv-/"},t1={title:"Chronologie",lead:"Von seiner Geburt 1950 bis heute: Studium, akademische Meilensteine sowie seine Schreib- und Übersetzungsarbeit, Jahr für Jahr.",note:"Eine vollständige Chronologie von Leben, Studium, Berufungen und Veröffentlichungen.",milestoneLabel:"Meilenstein"},n1={title:"Das Werk",lead:"Vier ineinander verwobene Stränge bilden einen einzigen philosophischen Weg.",areas:[{title:"Ontologie",text:"Im Zentrum des Werks steht die älteste Frage der Philosophie: Was bedeutet „sein“? Über die Vorsokratiker, Platon und Aristoteles bis hin zur modernen Neuformulierung der Frage wird der Sinn der Existenz selbst gesucht."},{title:"Metaphysik & Hermeneutik",text:"Die Methode der „Rückkehr zu den Sachen selbst“ und die Kunst der Auslegung führen zu einer Philosophie, die keine Schemata aufzwingt, sondern die Phänomene sich zeigen lässt."},{title:"Sprachphilosophie",text:"Sprache ist kein bloßes Werkzeug, sondern der Ort, an dem Sinn möglich wird. So wird das Übersetzen selbst zu einer philosophischen Handlung — die Suche nach dem rechten Wort als Suche nach der Wahrheit."},{title:"Ethik & das menschliche Maß",text:"Jenseits der Theorie bleibt die Frage: Wie soll man leben? Tod, Zeit, Freiheit und Verantwortung bestimmen den Horizont eines nachdenklichen Lebens."}]},r1={title:"Interessen",lead:"Die Gebiete, die das Denken und Werk von Giannis Tzavaras geprägt haben — von der altgriechischen Philosophie bis zur ästhetischen Erziehung — samt den zugehörigen Büchern, Übersetzungen und wissenschaftlichen Beiträgen.",photos:[{src:"images/foto-giannis.jpg",caption:"Giannis Tzavaras"},{src:"images/giannis-rubik.jpg",caption:"Spiel und Denken — das Rätsel als Herausforderung"}],sections:[{letter:"A",heading:"Altgriechische Philosophie",groups:[{label:"Zugehörige Bücher",items:["*Das Gedicht des Parmenides* (1980)","*Die Dichtung des Empedokles* (1988)","Plotin: *Das „große Buch“* (= Enneaden 30–33) (1995)"]}]},{letter:"B",heading:"Ontologie – Metaphysik",groups:[{label:"Zugehörige Bücher",items:["*Bewegung bei Kierkegaard* (1978)","*Die kantische Zeit nach Heidegger* (1989)","*Liebe – Krieg. Ein Essay zur Weltanschauung* (1993)","*Die Entwertung der Werte: Nietzsche und Heidegger* (2005)","*Einführung in die Ontologie* (2009)","Übersetzungen ontologisch-metaphysischer Bücher von Thomas von Aquin, Heidegger, Kant und Hegel."]}]},{letter:"C",heading:"Bildungsphilosophie",groups:[{label:"Zugehöriges Buch",items:["*Probleme der Bildungsphilosophie* (1. Auflage, Rethymno 2000; 2. Auflage, E-Book, 2015)."]},{label:"Zugehöriger wissenschaftlicher Beitrag",items:["„Demokratische Bildung als Erfahrung kollektiver Selbstinstituierung und Selbstverwaltung“. Ein Beitrag auf der wissenschaftlichen Tagung „Die Krise der Demokratie als Krise der demokratischen Bildung“ (Alexandroupoli, 8.–9. November 2013)."]}]},{letter:"D",heading:"Didaktik der Philosophie",groups:[{label:"Zugehörige Bücher",items:["*Handbuch der Philosophie* (1995, 2001, 2006)","Übersetzung von: Joanna Haynes, *Kinder als Philosophen* (2009)"]}]},{letter:"E",heading:"Ästhetik und ästhetische Erziehung",groups:[{label:"Zugehörige Werke",items:["M. Heidegger, *Der Ursprung des Kunstwerks*. Übersetzt von G. Tzavaras (1986).","*Anthologie der Ästhetik* (2007)","Die Zeitschrift *Ästhetische Erziehung* (2002–2014).","„Die Verbreitung interkünstlerischen Wissens über eine Website. Allgemeine Prinzipien“. Ein wissenschaftlicher Beitrag auf der internationalen Tagung „Auf dem Weg zu neuer Interkünstlerischkeit und Interkulturalität durch den Einsatz neuer Technologie“, veranstaltet vom Labor für künstlerische und kulturelle Bildung des Instituts für Grundschulpädagogik der Universität der Ägäis (Rhodos, 5. Februar 2011). Veröffentlicht in den Tagungsakten."]}]}]},i1={title:"Bücher & Bibliografie",lead:"Die eigenständigen Bücher von Giannis Tzavaras — Studien, Essays sowie kommentierte oder zweisprachige Ausgaben. Bei jedem Titel sind Verlag und Jahr angegeben.",note:"Nur eigenständige Bücher; die Titel sind in ihrer Originalsprache (Griechisch / Deutsch) angegeben.",countLabel:"Bücher",pagesLabel:"S.",tabBooks:"Bücher",tabTranslations:"Übersetzungen",translationsLead:"Von Giannis Tzavaras übersetzte philosophische Werke — von Kierkegaard und Heidegger bis zu Kant, Hegel, Plotin und Schelling. Bei jedem Titel sind Verlag und Jahr angegeben.",translationsNote:"Übersetzungen der Werke anderer Denker; die Titel sind in der Sprache der Ausgabe angegeben.",translationsCountLabel:"Übersetzungen"},o1={title:"Artikel & Veröffentlichungen",lead:"Eine Auswahl wissenschaftlicher Artikel, Essays und Beiträge zu Sammelbänden und Zeitschriften.",items:[{year:"1974",title:"«Προβλήματα και προτάσεις για μια νεοελληνική μετάφραση του Sein und Zeit του Μάρτιν Χάιντεγγερ»",source:"*Φιλοσοφία. Επετηρίς του Κέντρου Φιλοσοφίας της Ακαδημίας Αθηνών* 4 (1974), 449-458."},{year:"1978",title:"«Η ριζική αναγκαιότητα κατά τον Χάιντεγγερ. Μια προσπάθεια για πρόσβαση στο Είναι και χρόνος»",source:"*Εποπτεία* 29 (1978), 955-960."},{year:"1979",title:"«Ένα κείμενο του Αριστοτέλη για την αλήθεια. Των Μετά τα Φυσικά Θ 10»",source:"*Εποπτεία* 34 (1979), 415-428."},{year:"1979",title:"«Η σχέση της αμφιβολίας προς το σκέπτεσθαι και την πίστη στον Κίρκεγκωρ»",source:"*Φιλοσοφία. Επετηρίς του Κέντρου Ερεύνης της Ελληνικής Φιλοσοφίας της Ακαδημίας Αθηνών* 8-9 (1978-79), 401-418."},{year:"1984",title:"«Η απεραντοσύνη του χρόνου. Έρευνα στον Αριστοτέλη»",source:"*Αριάδνη. Επετηρίδα της Φιλοσοφικής Σχολής του Πανεπιστημίου Κρήτης* 2 (1984), 126-139."},{year:"1985",title:"«Ο Ζαρατούστρα του Νίτσε ως κήρυκας του ολέθρου»",source:"*Φιλοσοφία. Επετηρίς του Κέντρου Ερεύνης της Ελληνικής Φιλοσοφίας της Ακαδημίας Αθηνών* 15-16 (1985-86), 398-443."},{year:"1988",title:"«Διαλεκτική κίνηση στη φιλοσοφία της τέχνης του Χάιντεγγερ»",source:"Συμμετοχή στο 3ο Πανελλήνιο συνέδριο της Ελληνικής Φιλοσοφικής Εταιρείας («Η έννοια της διαλεκτικής», 1986). Στον τόμο: *Η διαλεκτική*, Ελληνική Φιλοσοφική Εταιρεία, Αθήνα 1988, 383-387."},{year:"1989",title:"“Heideggers Unterscheidung zwischen Zuhandenheit und Vorhandenheit”",source:"*Philosophisches Jahrbuch* 96 (1989), 367-371. (Ελληνική μετάφραση 2015: «Η διάκριση του Χάιντεγγερ μεταξύ πρόχειρων και παρευρισκόμενων όντων».)"},{year:"1990",title:"«Η θεμελιώδης Οντολογία του Μάρτιν Χάιντεγγερ»",source:"Συμμετοχή στο Συμπόσιο «Χάιντεγγερ και Αντόρνο – ο διάλογος που δεν πραγματοποιήθηκε» (Ινστιτούτο Γκαίτε Αθηνών, 22-24 Νοεμβρίου 1989). *Λεβιάθαν* 8 (1990), 21-26."},{year:"1991",title:"«Ο χρόνος της καθημερινότητας στον Αριστοτέλη και στον Heidegger»",source:"*Ζήνων* 10-12 (1989-91), 15-19."},{year:"1992",title:"«Πυθαγόρειες επιδράσεις στη φιλοσοφία του Εμπεδοκλή»",source:"Ανακοίνωση στο 3ο Διεθνές Συνέδριο Ελληνικής Φιλοσοφίας (Σάμος, 22-26/8/1991). Στον τόμο: Κωνσταντίνος Βουδούρης (επιμ.), *Πυθαγόρεια Φιλοσοφία*, Αθήνα-Σάμος 1992, 189-194."},{year:"1994",title:"«Ο εξωπραγματικός χαρακτήρας του καλλιτεχνήματος κατά τον Martin Heidegger»",source:"Συμμετοχή στο 6ο Πανελλήνιο συνέδριο της Ελληνικής Φιλοσοφικής Εταιρείας («Αισθητική και Φιλοσοφία της τέχνης», Αθήνα 18-20/5/1994). Στον τόμο: Παύλος Χριστοδουλίδης (επιμ.), *Αισθητική και θεωρία της τέχνης*, Εκδόσεις Καρδαμίτσα, Αθήνα 1994, 179-183."},{year:"1994",title:"«Το διονυσιακό στοιχείο κατά τον πρώιμο Νίτσε»",source:"Ανακοίνωση στην εκδήλωση «Ο Νίτσε και η Ελλάδα» (Ινστιτούτο Γκαίτε Αθηνών & Γαλλικό Ινστιτούτο Αθηνών, 8-9/12/1994)."},{year:"1995",title:"«Μια εναλλακτική πρόταση για τη διδασκαλία της φιλοσοφίας στη Μέση Εκπαίδευση»",source:"Διάλεξη ενώπιον φιλολόγων της Ανατολικής Αττικής (Παλλήνη, 11/4/1994). *Φιλοσοφία και Παιδεία* 1 (1995), τεύχος 3, 12-14."},{year:"1995",title:"«Ο διάλογος ως μελλοντική φιλοσοφική μέθοδος»",source:"Στον τόμο: *Παρόν και μέλλον της φιλοσοφίας* (Πανεπιστήμιο Κρήτης, Τομέας Φιλοσοφίας), Αθήνα-Γιάννινα 1995, 77-84."},{year:"1996",title:"“Craft and Craftsman According to Plato”",source:"Εισήγηση σε διεθνές σεμινάριο «Τεχνολογία και γνώση. Φιλοσοφικές και κοινωνιολογικές διερευνήσεις», Ρέθυμνο 17-18 Οκτωβρίου 1996."},{year:"1998",title:"«Η ιατρο-θεολογική φιλοσοφία του ύστερου Kierkegaard και οι ιστορικές καταβολές της»",source:"Ανακοίνωση στο συνέδριο «Ιατρική και φιλοσοφία» (Κως-Κάλυμνος, Αύγουστος 1997). Στον τόμο: Κωνσταντίνος Βουδούρης (επιμ.), *Φιλοσοφία και ιατρική*, Αθήνα 1998, 297-301."},{year:"1999",title:"«Χάιντεγγερ και Αναξίμανδρος»",source:"*Διαβάζω* 399 (1999), 121-124."},{year:"2001",title:"«Ένα καινούριο απόσπασμα από την ποίηση του Εμπεδοκλή»",source:"Εισήγηση σε διεθνές συνέδριο για τα νέα αποσπάσματα του Εμπεδοκλή (Παρίσι, 26-27 Μαΐου 2000). *Ελληνική Φιλοσοφική Επιθεώρηση* 18 (2001), 45-57."},{year:"2001",title:"«Φιλοσοφία της παιδείας στον Ηράκλειτο»",source:"Εισήγηση στο Β΄ Διεθνές Συνέδριο Φιλοσοφίας, Πανεπιστήμιο Κύπρου, Λευκωσία, 5-7 Απριλίου 2001."},{year:"2002",title:"«Αληθινά και ψευδή παραμύθια κατά τον Πλάτωνα»",source:"Εισήγηση σε Διεθνές Συνέδριο του Παιδαγωγικού Τμήματος Π.Ε. του Πανεπιστημίου Κρήτης (18-20/10/2001). Στον τόμο: *Ψυχοπαιδαγωγική της Προσχολικής Ηλικίας*, Ρέθυμνο 2002, τόμος Β΄, 706-709."},{year:"2002",title:"«Αξιώματα διαπαιδαγώγησης του μικρού παιδιού στον Αιμίλιο του Ρουσσώ»",source:"Στον τόμο: Ευαγγελία Κούρτη (επιμ.), *Η έρευνα στην προσχολική εκπαίδευση*, τόμος Γ΄, Εκδόσεις Τυπωθήτω – Γ. Δαρδανός, Αθήνα 2002, 217-223."},{year:"2004",title:"«Η αγωνία ως μέσο ηθικο-θρησκευτικής διαπαιδαγώγησης κατά τον Κίρκεγκωρ»",source:"Στον τόμο: *Ηθική και θρησκευτική ανάπτυξη και αγωγή του παιδιού*, Πανεπιστήμιο Κρήτης, Ρέθυμνο 2004, 584-588."},{year:"2005",title:"“Heideggers Hauptwerk in Neugriechisch”",source:"*Studia Phaenomenologica* 5 (2005), 119-127."},{year:"2007",title:"«Αισθητική Αγωγή μέσω φιλοσοφικών κειμένων»",source:"*Φιλοσοφία και Παιδεία* 41 (2007), 16-18."},{year:"2008",title:"«Ο συγκαιρινός και ο κατοπινός μαθητής κατά τον Κίρκεγκωρ»",source:"*Φιλοσοφία και Παιδεία* 49-50 (2008), 4-6."},{year:"2010",title:"«Μεταφράζοντας το Dasein του Martin Heidegger»",source:"Στο: *Ευβουλία. Αφιέρωμα στον ομότιμο καθηγητή Βασίλειο Α. Κύρκο* (επιμ. Κωνσταντίνος Θ. Πέτσιος), Ιωάννινα 2010, 255-262."},{year:"2012",title:"«Η στοχαστική διαλογική δραστηριότητα ως έξοχη ευκαιρία για εκδημοκρατισμό του σχολικού αναλυτικού προγράμματος»",source:"Πρακτικά ημερίδας (Ρέθυμνο, 22-10-2010), 1-8. Αναδημοσιεύτηκε στο *Διά-ΛΟΓΟΣ* 2 (2012), 294-304."},{year:"2012",title:"«Η ανθρώπινη μοίρα κατά τον Heidegger»",source:"*Φιλοσοφείν* 5 (2012), 188-210."},{year:"2013",title:"«Η τελεολογική αναστολή της ηθικότητας κατά τον Kierkegaard. Μια υπεράσπιση»",source:"*Φιλοσοφία. Επετηρίς του Κέντρου Ερεύνης της Ελληνικής Φιλοσοφίας της Ακαδημίας Αθηνών* 43 (2013), 365-380."},{year:"2013",title:"«Η δημοκρατική εκπαίδευση ως εμπειρία συλλογικής αυτοθέσμισης και αυτοδιαχείρισης»",source:"Ανακοίνωση στην επιστημονική διημερίδα «Η κρίση της δημοκρατίας ως κρίση της δημοκρατικής παιδείας» (Αλεξανδρούπολη, 8-9/11/2013)."},{year:"2014",title:"«Κράτος και εκπαίδευση κατά τον πρώιμο Νίτσε»",source:"*Φιλοσοφία και Παιδεία* 66-67 (2014), 4-7."},{year:"2015",title:"«Ο σφαιρικός θεός του Εμπεδοκλή»",source:"*Φιλοσοφικά Δημοσιεύματα 2015*, 1-18."},{year:"2016",title:"«Νεότερες περιπέτειες του νόμου της αιτιότητας»",source:"*Φιλοσοφείν: επιστήμη, εύνοια, παρρησία* 14 (2016), 399-409."},{year:"2017",title:"«Εμπειρία θανάτου κατά τον Ρίλκε»",source:"*Φιλοσοφείν: επιστήμη, εύνοια, παρρησία* 15 (2017), 355-374."},{year:"2018",title:"«Ο χρόνος κατά τον Αίαντα του Σοφοκλή»",source:"*Φιλοσοφείν: επιστήμη, εύνοια, παρρησία* 18 (Ιούνιος 2018), 227-238."},{year:"2019",title:"«Η ουσία της σύγχρονης τέχνης κατά τον Heidegger»",source:"*Ελληνική Φιλοσοφική Επιθεώρηση* 108 (2019), 210-225."},{year:"2021",title:"«Μικρή Λογική» (Χέγκελ)",source:"*Βικιπαίδεια*, Μάιος 2021."}]},a1={title:"Blog",lead:"Gedanken, Notizen und kurze Essays — im Rhythmus des täglichen Studiums geschrieben.",posts:[{id:"i-techni-tis-argis-anagnosis",date:"2026-05-18",title:"Die Kunst des langsamen Lesens",tags:["Bildung","Lesen","Methode"],excerpt:"In einer Welt, die immer schneller liest, beharrt die Philosophie auf dem Gegenteil: auf Geduld.",body:["Wenn ich unterrichte, sage ich meinen Studierenden oft, dass ein philosophischer Text nicht gelesen, sondern bewohnt wird. Wir eilen nicht durch ihn hindurch wie durch einen Korridor. Wir bleiben, wir schauen erneut hin, wir lassen die Worte sich öffnen.","Langsames Lesen ist kein Selbstzweck. Es ist Methode. Um eine einzige Seite von Aristoteles oder Heidegger zu studieren, kann ein ganzer Tag nötig sein — und das ist kein Versagen, sondern der richtige Rhythmus.","Vielleicht ist das Revolutionärste, was ein junger Mensch heute tun kann, genau dies: sich mit einem schwierigen Buch hinzusetzen und es nicht eilig zu haben."]},{id:"giati-metafrazoume",date:"2026-03-02",title:"Warum wir Philosophie übersetzen",tags:["Übersetzung","Sprache"],excerpt:"Jede Übersetzung ist eine Auslegung, und jede Auslegung eine Entscheidung darüber, was Wahrheit bedeutet.",body:["Man fragt mich oft, warum ich so viele Jahre dem Übersetzen von Texten gewidmet habe, die nur wenige lesen werden. Meine Antwort ist einfach: Übersetzen ist die langsamste und zugleich treueste Weise des Lesens.","Um ein einziges Wort Heideggers zu übersetzen, muss man es zu Ende verstehen. Es genügt nicht zu wissen, was es bedeutet; man muss finden, wie derselbe Gedanke in der eigenen Sprache klingt.","Auf diese Weise empfängt die griechische Sprache nicht nur eine fremde Idee — sie verändert sich auch, sie wächst, sie entdeckt neue Möglichkeiten. Das ist der wahre Gewinn des Übersetzens."]},{id:"to-erotima-pou-menei",date:"2026-01-11",title:"Die Frage, die bleibt",tags:["Ontologie","Reflexion"],excerpt:"Die Philosophie häuft keine Antworten an; sie pflegt eine Frage, die niemals aufhört.",body:["Nach einem Leben unter Büchern gestehe ich, dass ich nicht mehr Gewissheiten habe als in meiner Jugend. Aber ich habe bessere Fragen.","Die Frage nach dem Sein — warum es etwas gibt und nicht vielmehr nichts — ist nie gelöst worden, und vielleicht sollte sie es auch nicht. Ihr Wert liegt nicht in der Antwort, sondern darin, dass sie uns wach hält.","Das ist es, was ich meinen Studierenden zu hinterlassen versuche: kein System, sondern die Fähigkeit, vor der Tatsache zu staunen, dass die Welt existiert."]}]},s1={title:"Weitere Aktivitäten",lead:"Websites, akademische und institutionelle Aktivitäten sowie Vorträge von Giannis Tzavaras.",sourceLabel:"Mehr auf der persönlichen Website lesen",sourceUrl:"https://istoselidatzavara.webnode.page/%ce%b5%cf%85%cf%81%cf%8d%cf%84%ce%b5%cf%81%ce%b5%cf%82%20%ce%b4%cf%81%ce%b1%cf%83%cf%84%ce%b7%cf%81%ce%b9%cf%8c%cf%84%ce%b7%cf%84%ce%b5%cf%82/",sections:[{id:"websites",letter:"A",heading:"Websites von Giannis Tzavaras",items:[{text:"Griechische philosophische Bibliografie 1980–2019. Ein Archiv der griechischsprachigen philosophischen Bibliografie.",url:"https://tzavaras-ioannis.blogspot.com/2022/05/blog-post_9.html"},{text:"Ästhetische Erziehung (Aisthitiki Agogi). Eine halbjährliche Studierendenzeitschrift (ohne Unterbrechung von Oktober 2002 bis Oktober 2014 erschienen), herausgegeben von Giannis Tzavaras mit der grafischen Gestaltung von Konstantinos Nyktaris. Sie enthielt vor allem Seminararbeiten aus dem von G. Tzavaras betreuten Seminar zur ästhetischen Erziehung. Sie veröffentlichte Originaltexte aus einem weiten Feld: A) Theorien über die Kunst, das Schöne und verwandte Begriffe; B) Kunstwerke (ihre Analyse und Bewertung); C) Kunstgeschichte; D) ästhetische Bildung und künstlerische Erziehung. Das Interesse richtete sich besonders auf den Bereich der Vorschul- und frühen Schulbildung.",url:"http://periodikoaisthag.webnode.com"},{text:"Schattentheater und Bildung. Ein Versuch, dem griechischen Publikum die pädagogischen Möglichkeiten des Schattentheaters jenseits des traditionellen Karagiozis nahezubringen.",url:"http://theatroskivvn.yolasite.com"},{text:"Philosophie für Kinder. Ein Versuch, dem griechischen Publikum die internationale philosophisch-pädagogische Bewegung „Philosophie für Kinder“ bekannt zu machen.",url:"https://childrenandphilosophy.webnode.com"},{text:"„Philosophische Veröffentlichungen“ (Filosofika Dimosievmata). Online-Veröffentlichung griechischsprachiger philosophischer Texte ab 2011.",url:"https://www.philosophicalbibliography.com/index.php?option=com_content&view=article&id=5%3Afilosofika-dimosieymata"}]},{id:"other",letter:"B",heading:"Weitere Tätigkeiten",items:[{text:"Er war zwei Jahre lang (1985–1987) stellvertretender Vertreter der Universität Kreta im Präfekturausschuss für Volksbildung (N.E.L.E.) der Präfektur Rethymno."},{text:"Er wirkte an der Organisation folgender Tagungen mit: A) „Wittgenstein-Philosophiesymposium“, 15.–17. Dezember 1989. B) „Gegenwart und Zukunft der Philosophie“. Ein zweitägiges philosophisches Symposium, Orthodoxe Akademie von Kreta, November 1991. C) „Technologie und Wissen. Philosophische und soziologische Untersuchungen“. Ein zweitägiges internationales Seminar, Rethymno, 17.–18. Oktober 1996."},{text:"Im akademischen Jahr 1993–1994 war er Vorsitzender des Instituts für Philosophie und Sozialwissenschaften, in den akademischen Jahren 2005–2007 Vorsitzender des Instituts für Vorschulpädagogik der Universität Kreta."},{text:"Über mehrere Jahre betreute er als Hauptbetreuer die Dissertation von Kostas Kourpetis zum Thema „Mensch und Gott bei Empedokles“. Die Dissertation wurde im Juni 1996 erfolgreich verteidigt (Note: ausgezeichnet)."},{text:"Er war Mitglied zahlreicher dreiköpfiger Kommissionen, die zur Betreuung von Masterarbeiten und Dissertationen (PhD) eingesetzt wurden. Darüber hinaus begutachtete er zahlreiche Dissertationen als Mitglied ihrer siebenköpfigen Prüfungskommission."},{text:"Er war Mitglied zahlreicher Wahlgremien, die zur Beurteilung der Wahl oder Beförderung von Hochschullehrenden der Universität Kreta und anderer griechischer Universitäten eingesetzt wurden."},{text:"In den Jahren 1993–1997 war er ordentliches Mitglied des Forschungsausschusses (E.L.K.E.) der Universität Kreta als Vertreter des Instituts für Philosophie und Sozialwissenschaften."},{text:"Über mehrere Jahre war er stellvertretender Vorsitzender des Instituts für Philosophie und Sozialwissenschaften sowie des Instituts für Vorschulpädagogik der Universität Kreta."},{text:"Über mehrere Jahre (1998–2005) war er Vizepräsident der Ausbildungsstätte für Kindergärtnerinnen der Universität Kreta und in den Jahren 2005–2007 Präsident derselben Einrichtung."},{text:"Er organisierte einen wissenschaftlichen Workshop zum Thema: „Vom Monolog des Lehrers zum Gruppengespräch. Philosophisches Denken und Forschen im Grundschulunterricht“ (Rethymno, 22. Oktober 2010). Die Akten des Workshops mit erweiterten und verbesserten Fassungen der Beiträge wurden in der Zeitschrift Dia-LOGOS 2 (2012), S. 181–339, veröffentlicht."},{text:"Er war von 2010 bis 2012 Mitglied der Einheit zur Qualitätssicherung (MO.DI.P.) der Universität Kreta."},{text:"Er war Mitherausgeber der Zeitschrift Dia-LOGOS. Jahrbuch der philosophischen Forschung (ab 2011), Mitglied des Redaktionsausschusses der Zeitschrift Filosofein. Episteme, eunoia, parrhesia, sowie Mitglied des wissenschaftlichen Ausschusses der Zeitschrift Philosophie und Bildung."}]},{id:"lectures",letter:"C",heading:"Vorträge",items:[{text:"„Ein alternativer Vorschlag für den Philosophieunterricht in der Sekundarstufe“. Ein Vortrag vor Philologen Ostattikas, Pallini, 11. April 1994. Der Text wurde in der Zeitschrift „Philosophie und Bildung“ 1 (1995), Heft 3, S. 12–14, veröffentlicht."},{text:"„Der Gott des Empedokles“. Ein 1997 in Athen gehaltener Vortrag. Der Text wurde in mehrfach überarbeiteter Form 2015 unter dem Titel „Der kugelförmige Gott des Empedokles“ veröffentlicht."},{text:"„Ist das Kunstwerk ein Ding oder ein Sinn?“. Ein in Rethymno, Galerie Armonia, am 27. November 2002 gehaltener Vortrag."},{text:"„Manolis Markakis als Philosoph“. Ein vom Philologenverband der Präfektur Heraklion, Kreta, organisierter Vortrag, Heraklion, 3. März 2003, zu Ehren von Manolis Markakis (1942–2001), Soziologe, Philosoph, Dichter und Schriftsteller. Veröffentlicht in der Zeitschrift „Dialogos“ (herausgegeben vom Philologenverband der Präfektur Heraklion), Heft 17, Oktober 2005, S. 203–208."},{text:"„Existiert die Zeit?“. Ein in Rethymno gehaltener Vortrag, im Museum für zeitgenössische Kunst Kretas – Galerie L. Kanakakis, 2. Dezember 2009. Der Vortrag wurde in Athen, in der Buchhandlung „Patakis“ (Akadimias-Str. 65), am 11. Februar 2010 wiederholt, unter dem Titel: „Die Existenz der Zeit nach Aristoteles, Kant und Heidegger“."}]}]},l1={title:"Kontakt",lead:"Für wissenschaftliche Korrespondenz, Einladungen oder Fragen zum Werk.",emailLabel:"E-Mail",email:"itzavar@edc.uoc.gr",locationLabel:"Standort",location:"Rethymno, Kreta",note:"Diese Seite ist ein digitales Archiv; es gibt keinen automatischen Mechanismus zum Versenden von Nachrichten. Bitte verwenden Sie die obige E-Mail-Adresse.",writeButton:"Eine E-Mail senden"},u1={tagline:"Ein digitales Archi
